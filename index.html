<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Suical</title>
<meta name="theme-color" content="#15302A">
<meta name="description" content="Recettes simples et pas chères, avec le prix de chaque plat, le budget du mois et les apports nutritionnels. Hors ligne.">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF2EF; --surface:#FFFFFF; --ink:#15302A; --muted:#5B6E68; --line:#D3DDD8; --line2:#E3EAE6;
  --seg:#DCE4E0; --seg-ink:#33443F; --dim:rgba(21,48,42,.5);
  --yolk:#F2B705; --yolk-ink:#15302A; --yolk-soft:#FCEFC2; --yolk-soft-ink:#5E4500;
  --tomato:#A8321F; --tomato-bg:#FBE9E6; --ok:#2F7A5B; --ok-bg:#E1F0E8; --ok-ink:#23614A;
  --font:"Archivo","Helvetica Neue",Arial,sans-serif;
  --tabbar:64px; --safe-b:env(safe-area-inset-bottom,0px);
  box-sizing:border-box;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1E1B; --surface:#162925; --ink:#E4EEEA; --muted:#93A7A0; --line:#28403A; --line2:#21362F;
    --seg:#203631; --seg-ink:#C5D6CF; --dim:rgba(0,0,0,.6);
    --yolk-soft:#3D3310; --yolk-soft-ink:#F5D772;
    --tomato:#F08A78; --tomato-bg:#3A1F1B; --ok:#6CC49D; --ok-bg:#1B3A2E; --ok-ink:#9BDDBC;
  }
}
*,*::before,*::after{box-sizing:inherit}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(var(--tabbar) + var(--safe-b) + 24px);-webkit-tap-highlight-color:transparent}
body.sheet-open{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit;box-sizing:border-box}
input,select,textarea{font-size:16px}
button{cursor:pointer}
button:disabled{opacity:.4;cursor:default}
svg{display:block;flex:none}
:focus-visible{outline:3px solid var(--yolk);outline-offset:2px}
h1{margin:0;font-size:2.1rem;font-weight:800;font-stretch:75%;line-height:1}
main{max-width:600px;margin:0 auto;padding:0 16px}
section[hidden],[hidden]{display:none !important}

/* en-têtes */
.head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:22px 0 0;min-height:66px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 -8px;padding-top:8px}
.back{height:44px;display:flex;align-items:center;gap:2px;padding:0 8px;border:0;background:none;font-weight:600;font-size:.95rem}
.top-actions{display:flex;gap:4px;align-items:center}
.page-title{font-size:1.75rem;font-stretch:80%;line-height:1.1;margin:8px 0 0}
.h2{margin:28px 0 10px;font-size:1.25rem;font-weight:800;font-stretch:85%}
.sec{margin:20px 0 8px;font-size:.95rem;font-weight:700;color:var(--muted)}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:24px 0 10px}
.sec-head h2{margin:0;font-size:1.1rem;font-weight:800}
.sec-head span{font-size:.88rem;color:var(--muted);font-variant-numeric:tabular-nums}
.caption{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:12px 0 0;font-size:.88rem;color:var(--muted);min-height:44px}
.caption select{border:0;background:none;font-weight:700;font-size:.88rem;color:var(--ink);height:44px;padding:0 2px;max-width:none;width:auto}
.sort{display:flex;align-items:center;gap:2px}
.hint{font-size:.82rem;color:var(--muted);margin:0}
.note{font-size:.82rem;line-height:1.4;color:var(--muted);margin:14px 0 0}
.intro{margin:8px 0 0;color:var(--muted);font-size:.92rem}
.empty{color:var(--muted);font-size:.92rem;padding:8px 0;margin:0}
.empty-box{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px 16px;margin-top:16px;text-align:center;color:var(--muted)}
.empty-box p{margin:0 0 12px}
.empty-box p:last-child{margin:0}
.notice{margin:12px 0 0;padding:12px 14px;border-radius:12px;background:var(--yolk-soft);color:var(--yolk-soft-ink);font-size:.9rem}

/* boutons */
.btn{min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 16px;border:1px solid var(--ink);border-radius:22px;background:none;font-weight:700;font-size:.95rem;white-space:nowrap}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.soft{background:var(--surface);border-color:var(--line);border-radius:12px;padding:0 14px}
.btn.danger{border-color:var(--tomato);color:var(--tomato)}
.btn.block{display:flex;width:100%;min-height:52px;border-radius:14px;font-size:1rem}
.btn .count{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--yolk);color:var(--yolk-ink);font-size:.75rem;display:inline-flex;align-items:center;justify-content:center}
.icon-btn{width:44px;height:44px;flex:none;display:flex;align-items:center;justify-content:center;padding:0;border:0;border-radius:22px;background:none}
.icon-btn.solid{background:var(--ink);color:var(--bg)}
.icon-btn.outline{border:1px solid var(--ink)}
.star[aria-pressed="true"] svg{fill:var(--yolk);stroke:var(--ink)}
.link{min-height:44px;border:0;background:none;padding:0 8px;font-weight:700;text-decoration:underline;text-underline-offset:3px}
.row-btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}

/* recherche, segments, pastilles */
.toolbar{display:flex;gap:8px;margin-top:16px}
.search{flex:1;min-width:0;height:44px;display:flex;align-items:center;gap:8px;padding:0 12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;color:var(--muted)}
.search:focus-within{outline:3px solid var(--yolk);outline-offset:1px}
.search input{flex:1;min-width:0;border:0;background:none;outline:none;padding:0;color:var(--ink)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:4px;background:var(--seg);border-radius:12px}
.toolbar + .seg{margin-top:12px}
.seg button{min-height:44px;min-width:44px;border:0;border-radius:9px;background:none;color:var(--seg-ink);font-weight:600;font-size:.95rem;padding:0 12px}
.seg [aria-checked="true"],.seg [aria-selected="true"]{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(21,48,42,.15)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.caption + .chips{margin-top:2px}
.chip{min-height:44px;display:inline-flex;align-items:center;gap:6px;padding:0 16px;border:1px solid var(--line);border-radius:22px;background:var(--surface);font-weight:600;font-size:.95rem}
.chip[aria-pressed="true"],.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.on{padding:0 12px 0 14px}

/* listes */
.group{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin:0;padding:0;list-style:none}
.group > * + *{border-top:1px solid var(--line2)}
.group.flat{background:none;border:0;border-radius:0}
.row{display:flex;align-items:center;gap:12px;width:100%;min-height:64px;padding:12px 16px;border:0;background:none;text-align:left;color:inherit}
.group.flat .row{padding:10px 0}
.row-main{flex:1;min-width:0}
.row-title{display:block;font-size:1rem;font-weight:600;line-height:1.3}
.row-sub{display:block;font-size:.82rem;color:var(--muted);margin-top:3px}
.row-price{flex:none;text-align:right}
.row-price b{display:block;font-size:1.2rem;font-weight:800;font-stretch:80%;font-variant-numeric:tabular-nums;white-space:nowrap}
.row-price span{font-size:.7rem;color:var(--muted)}
.row.nav{min-height:52px;padding:0 12px 0 16px;justify-content:space-between}
.row.nav .val{display:flex;align-items:center;gap:4px;color:var(--muted);white-space:nowrap}
.row.nav.strong .row-title{font-weight:700}
.row.nav.danger .row-title{color:var(--tomato)}
.badge{display:inline-block;margin-top:6px;padding:2px 8px;border-radius:999px;font-size:.75rem;font-weight:700;background:var(--tomato-bg);color:var(--tomato)}
.badge.ok{background:var(--ok-bg);color:var(--ok-ink)}
.badge.yolk{background:var(--yolk-soft);color:var(--yolk-soft-ink)}
.radio{flex:none;width:24px;height:24px;border-radius:12px;border:2px solid var(--muted);display:flex;align-items:center;justify-content:center}
[aria-checked="true"] > .radio{background:var(--ink);border-color:var(--ink);color:var(--bg)}
[aria-checked="true"] .row-title{font-weight:800}

/* fiche recette */
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.tag{padding:4px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--seg-ink);font-size:.8rem;font-weight:600}
.tag.ok{background:var(--ok-bg);border-color:transparent;color:var(--ok-ink);font-weight:700}
.tag.warn{background:var(--tomato-bg);border-color:transparent;color:var(--tomato);font-weight:700}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:16px}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.fact b{display:block;font-size:1.45rem;font-weight:800;font-stretch:75%;line-height:1.05;font-variant-numeric:tabular-nums}
.fact span{display:block;margin-top:2px;font-size:.75rem;color:var(--muted)}
.fact.yolk{background:var(--yolk);border-color:var(--yolk);color:var(--yolk-ink)}
.fact.yolk span{color:var(--yolk-ink);font-weight:600}
.stepper-card{display:flex;align-items:center;gap:12px;margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 12px 14px 16px}
.stepper-card > div:first-child{flex:1;min-width:0}
.stepper{flex:none;display:flex;align-items:center;gap:4px}
.stepper output{width:32px;text-align:center;font-size:1.4rem;font-weight:800;font-variant-numeric:tabular-nums}
.card-label{font-weight:700}
.ings li{display:flex;align-items:center;gap:10px;min-height:48px;padding:10px 16px}
.ings .q{flex:none;min-width:64px;font-weight:700;font-variant-numeric:tabular-nums}
.ings .n{flex:1;min-width:0}
.ings .p{flex:none;font-size:.88rem;color:var(--muted);font-variant-numeric:tabular-nums}
.ings + .hint{margin-top:8px}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.steps li{display:flex;gap:12px;line-height:1.5}
.steps .num{flex:none;width:28px;height:28px;border-radius:14px;background:var(--ink);color:var(--bg);font-size:.88rem;font-weight:800;display:flex;align-items:center;justify-content:center}
.actionbar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);padding:12px 16px calc(12px + var(--safe-b))}
.actionbar > div{max-width:568px;margin:0 auto}
details.more{position:relative}
details.more summary{list-style:none;width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:22px;cursor:pointer}
details.more summary::-webkit-details-marker{display:none}
.menu{position:absolute;right:0;top:48px;z-index:6;width:250px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 30px rgba(21,48,42,.18);overflow:hidden}
.menu button{width:100%;min-height:48px;display:flex;align-items:center;gap:10px;padding:0 16px;border:0;background:none;font-weight:600;text-align:left}
.menu button + button{border-top:1px solid var(--line2)}
.menu .danger-txt{color:var(--tomato)}

/* nutrition */
.macros{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.macros div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 4px;text-align:center}
.macros b{display:block;font-size:1.25rem;font-weight:800;font-stretch:75%;font-variant-numeric:tabular-nums}
.macros span{font-size:.75rem;color:var(--muted)}
.fold{margin-top:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.fold > summary{list-style:none;min-height:52px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 14px 0 16px;font-weight:700;cursor:pointer}
.fold > summary::-webkit-details-marker{display:none}
.fold[open] > summary svg{transform:rotate(180deg)}
.fold > summary svg{color:var(--muted)}
.fold-body{padding:0 16px 16px}
.fold-body .macros{margin-bottom:12px}
.fold-body .macros div{background:var(--bg)}
.micro{display:grid;gap:6px}
.micro-row{display:grid;grid-template-columns:minmax(0,1.3fr) auto minmax(32px,1fr) 40px;gap:8px;align-items:center;font-size:.85rem}
.micro-val{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.micro-bar{height:6px;border-radius:3px;background:var(--line2);overflow:hidden}
.micro-bar i{display:block;height:100%;background:var(--ok)}
.micro-pct{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.micro-note{font-size:.78rem;color:var(--muted);margin:10px 0 0}

/* semaine */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:16px}
.budget-top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.budget-top small{display:block;font-size:.8rem;font-weight:600;color:var(--muted)}
.budget-week{font-size:2.1rem;font-weight:800;font-stretch:72%;line-height:1.05;font-variant-numeric:tabular-nums}
.budget-month{text-align:right;font-size:1.25rem;font-weight:800;font-stretch:80%;font-variant-numeric:tabular-nums;white-space:nowrap}
.budget-month span{font-size:.88rem;font-weight:600;color:var(--muted)}
.bar{height:10px;border-radius:5px;background:var(--line2);overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;border-radius:5px;background:var(--ok)}
.bar i.over{background:var(--tomato)}
.card p{margin:10px 0 0;font-size:.9rem;line-height:1.4}
.card .warn{color:var(--tomato);font-weight:600}
.setting{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:16px}
.day{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.day-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:14px 16px 4px}
.day-head h2{margin:0;font-size:1.15rem;font-weight:800}
.day-head span{font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.slot{width:100%;display:flex;align-items:center;gap:8px;min-height:44px;padding:8px 12px 8px 16px;border:0;border-top:1px solid var(--line2);background:none;text-align:left;color:inherit}
.slot.main{min-height:56px;padding-top:12px;padding-bottom:12px}
.slot-label{flex:none;width:66px;font-size:.82rem;color:var(--muted)}
.slot-main{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start}
.slot-name{font-size:.9rem;color:var(--seg-ink);line-height:1.3}
.slot.main .slot-name{font-size:1rem;font-weight:600;color:var(--ink)}
.slot .slot-name.empty-slot{color:var(--muted);font-style:italic;font-weight:400}
.slot .badge{margin-top:4px}
.slot > svg{color:var(--muted)}
.day + .fold,.setting + .fold{margin-top:16px}

/* courses */
.link-card{width:100%;display:flex;align-items:center;gap:12px;min-height:64px;margin-top:16px;padding:10px 12px 10px 14px;background:var(--surface);border:1px solid var(--line);border-radius:16px;text-align:left;color:inherit}
.lc-icon{flex:none;width:40px;height:40px;border-radius:12px;background:var(--bg);display:flex;align-items:center;justify-content:center}
.link-card > svg{color:var(--muted)}
.buy{display:flex;align-items:center;gap:14px;min-height:60px;padding:10px 16px;cursor:pointer}
.buy input{flex:none;width:22px;height:22px;margin:0;accent-color:var(--ink)}
.buy-price{flex:none;font-weight:700;font-variant-numeric:tabular-nums}
.buy-warn{display:block;margin-top:4px;font-size:.82rem;font-weight:600;color:var(--tomato)}
.buy.done .row-title{text-decoration:line-through;color:var(--muted)}
.totalbar{position:fixed;left:0;right:0;bottom:calc(var(--tabbar) + var(--safe-b));z-index:9;background:var(--surface);border-top:1px solid var(--line)}
.totalbar-in{max-width:600px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.tb-label{font-size:.75rem;font-weight:600;color:var(--muted)}
.tb-val{font-size:1.6rem;font-weight:800;font-stretch:75%;line-height:1.05;font-variant-numeric:tabular-nums}
.has-totalbar{padding-bottom:84px}

/* moi */
.profile{padding:16px 16px 14px}
.profile-name{font-size:1.15rem;font-weight:800}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:14px}
.stats div{background:var(--bg);border-radius:12px;padding:10px 12px}
.stats b{display:block;font-size:1.35rem;font-weight:800;font-stretch:75%;font-variant-numeric:tabular-nums}
.stats span{font-size:.75rem;color:var(--muted)}

/* formulaires, stock, aliments, éditeur */
select,input[type=text],input[type=number],input[type=search],textarea{min-height:44px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);max-width:100%}
.search input[type=search]{min-height:0;border:0;padding:0;background:none}
select{width:100%}
textarea{width:100%;min-height:120px}
textarea.mono{font-size:.8rem;font-family:ui-monospace,monospace;margin-top:12px}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;padding:12px 0 4px}
.field{display:grid;gap:4px;align-content:start;min-width:0}
.field label{font-size:.8rem;color:var(--muted)}
.field input,.field select,.field textarea{width:100%}
.wide{grid-column:1 / -1}
.sep{grid-column:1 / -1;font-size:.85rem;font-weight:800;margin-top:8px}
.check{display:flex;gap:8px;align-items:center;min-height:44px;font-size:.95rem}
.check input{width:20px;height:20px;accent-color:var(--ink)}
.ing-edit{display:grid}
.ing-row{display:grid;grid-template-columns:minmax(0,1fr) auto 44px;gap:4px 10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line2)}
.ing-name{grid-column:1 / -1;font-weight:600}
.ing-row .qty{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:.88rem}
.ing-row .qty input{width:96px;text-align:right}
.ing-cost{color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
.remove{width:44px;height:44px;border:1px solid var(--line);border-radius:22px;background:var(--surface);display:flex;align-items:center;justify-content:center;padding:0;color:var(--tomato)}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;align-items:center;padding:12px 16px}
.item-name{font-weight:600}
.item-days{font-size:.8rem;color:var(--muted)}
.item-days.low{color:var(--tomato);font-weight:600}
.item-ctl{display:flex;align-items:center;gap:6px}
.item-ctl input{width:84px;text-align:right;font-variant-numeric:tabular-nums}
.item-ctl small{color:var(--muted);min-width:20px}
.pack{min-height:44px;border:1px solid var(--ink);background:none;border-radius:22px;padding:0 12px;font-weight:600;white-space:nowrap;font-size:.85rem}
.food > summary{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:56px;padding:8px 16px;cursor:pointer;font-weight:600}
.food > summary::-webkit-details-marker{display:none}
.food > summary span{font-weight:400;font-size:.82rem;color:var(--muted);text-align:right}
.food[open] > summary{border-bottom:1px solid var(--line2)}
.food .fields{padding:12px 16px 16px;grid-template-columns:repeat(2,minmax(0,1fr))}
.food .fold{grid-column:1 / -1;margin:0}
.food .fold .fields{padding:0}
.log-row{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:56px;padding:6px 8px 6px 16px}
.log-row time{display:block;color:var(--muted);font-size:.8rem}
.lines{display:grid;gap:4px;margin-top:10px}
.line{display:grid;grid-template-columns:1fr auto;gap:10px;font-size:.9rem;align-items:baseline}
.line b{font-variant-numeric:tabular-nums}

/* barre d'onglets */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
.tabbar-in{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.tabbar button{height:var(--tabbar);border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:.75rem;font-weight:600;color:var(--muted)}
.tabbar .pill{width:56px;height:30px;border-radius:15px;display:flex;align-items:center;justify-content:center}
.tabbar [aria-current="page"]{color:var(--ink);font-weight:700}
.tabbar [aria-current="page"] .pill{background:var(--yolk);color:var(--yolk-ink)}
body.paged .tabbar{display:none}
body.paged{padding-bottom:calc(84px + var(--safe-b))}

/* panneau du bas */
.sheet-back{position:fixed;inset:0;z-index:20;background:var(--dim);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:600px;max-height:calc(100% - 32px);background:var(--surface);border-radius:22px 22px 0 0;display:flex;flex-direction:column;padding-bottom:var(--safe-b);outline:none;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.6}}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:8px auto 0;flex:none}
.sheet-head{display:grid;grid-template-columns:76px minmax(0,1fr) 76px;align-items:center;padding:4px 8px 0;flex:none}
.sheet-head > div{text-align:center}
.sheet-head h2{margin:0;font-size:1.1rem;font-weight:800;text-align:center}
.sheet-head p{margin:0;font-size:.8rem;color:var(--muted)}
.sheet-search{padding:12px 16px 4px;flex:none}
.sheet-search .search{background:var(--bg);border-color:transparent}
.sheet-body{flex:1;overflow-y:auto;padding:0 16px 16px;overscroll-behavior:contain}
.sheet-foot{flex:none;padding:12px 16px 16px;border-top:1px solid var(--line2)}
.fgroup{border:0;margin:18px 0 0;padding:0;min-width:0}
.fgroup legend{padding:0;font-weight:800}
.fgroup .hint{margin-top:2px}
.fgroup .chips{margin-top:10px}

.toast{position:fixed;left:50%;bottom:calc(var(--tabbar) + var(--safe-b) + 16px);z-index:30;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:.9rem;transition:opacity .2s,transform .2s;pointer-events:none;max-width:90vw;text-align:center}
body.paged .toast{bottom:calc(84px + var(--safe-b) + 12px)}
body.with-total .toast{bottom:calc(var(--tabbar) + var(--safe-b) + 86px)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion: reduce){.toast{transition:none}.sheet{animation:none}}
</style>

   ============================================================ */
const LS_KEY = "suical-recettes-v3";
/* Clé distincte de l'ancienne version (stock et sessions) : ses données restent intactes dans la base. */
const DB_NAME = "suical", STORE = "state", KEY = "recettes-v3";
const clone = o => JSON.parse(JSON.stringify(o));

function freshState(){
  const stock = {}; for (const k in DEFAULT_ITEMS) stock[k] = 0;
  return {v:3, items:clone(DEFAULT_ITEMS), dishes:clone(DEFAULT_DISHES), plan:[], days:5, stock, log:[],
          favs:[], hidden:[], known:DEFAULT_DISHES.map(d=>d.id),
          profile:{male:false, age:19, cm:169, kg:60, steps:7000, sessions:1.5, sessionMin:60, intensity:1}, kgSet:false,
          budget:200, pasta:"normal", maxGluten:4, cart:[]};
}
let state = freshState();

/* IndexedDB : un seul enregistrement, plus robuste que localStorage sur mobile */
function openDB(){
  return new Promise((resolve, reject)=>{
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = () => req.result.createObjectStore(STORE);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
function idbGet(){
  return openDB().then(db => new Promise((resolve, reject)=>{
    const req = db.transaction(STORE, "readonly").objectStore(STORE).get(KEY);
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => reject(req.error);
  }));
}
function idbSet(value){
  return openDB().then(db => new Promise((resolve, reject)=>{
    const tx = db.transaction(STORE, "readwrite");
    tx.objectStore(STORE).put(value, KEY);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  }));
}
function lsBackup(){
  try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch(e){ /* quota, on ignore */ }
}

async function load(){
  try {
    const stored = await idbGet();
    if (stored) { state = migrate(stored); return; }
  } catch(e){ /* IndexedDB indisponible : on retombe sur localStorage */ }
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) { state = migrate(JSON.parse(raw)); await saveNow(); }
  } catch(e){ /* premier lancement */ }
}
function migrate(d){
  const s = freshState();
  if (!d || d.v!==3) return s;
  if (d.items) s.items = Object.assign(clone(DEFAULT_ITEMS), d.items);
  for (const [k,it] of Object.entries(s.items)) if (!("fam" in it) && DEFAULT_ITEMS[k]) it.fam = DEFAULT_ITEMS[k].fam || "";
  if (Array.isArray(d.dishes) && d.dishes.length) {
    /* recettes ajoutées dans une mise à jour du site : proposées une fois, jamais remises si supprimées */
    const known = new Set(Array.isArray(d.known) ? d.known : d.dishes.map(x=>x.id));
    s.dishes = d.dishes.concat(clone(DEFAULT_DISHES).filter(x=>!known.has(x.id) && !d.dishes.some(y=>y.id===x.id)));
  }
  for (const x of s.dishes) if (x.group!=="repas" && !Array.isArray(x.moments)) {
    const def = DEFAULT_DISHES.find(y=>y.id===x.id);
    x.moments = def && def.moments ? def.moments.slice() : ["petitdej"];
  }
  if (Array.isArray(d.favs)) s.favs = d.favs.filter(id=>s.dishes.some(x=>x.id===id));
  if (Array.isArray(d.hidden)) s.hidden = d.hidden.filter(id=>s.dishes.some(x=>x.id===id));
  if ([5,6,7].includes(d.days)) s.days = d.days;
  if (Array.isArray(d.plan)) s.plan = d.plan.slice(0, s.days).map(p=>[0,1,2,3].map(j=>(Array.isArray(p) && p[j]) || ""));
  if (d.stock) { for (const k in s.items) s.stock[k] = Number(d.stock[k])>0 ? Number(d.stock[k]) : 0; }
  if (Array.isArray(d.log)) s.log = d.log.slice(0,40);
  if (d.profile) Object.assign(s.profile, d.profile);
  s.kgSet = !!d.kgSet;
  if (Number(d.budget)>0) s.budget = Number(d.budget);
  if (d.pasta==="sg") s.pasta = "sg";
  if (Number(d.maxGluten)>=0) s.maxGluten = Number(d.maxGluten);
  if (Array.isArray(d.cart)) s.cart = d.cart.filter(k=>k in s.items);
  return s;
}
async function saveNow(){
  const snapshot = clone(state);
  try { await idbSet(snapshot); lsBackup(); }
  catch(e){ lsBackup(); toast("Sauvegarde en mémoire de secours"); }
}
let saveTimer = null;
function save(){ clearTimeout(saveTimer); saveTimer = setTimeout(saveNow, 250); }
window.addEventListener("pagehide", ()=>{ clearTimeout(saveTimer); lsBackup(); });

const dishes = () => state.dishes;

const isHidden = d => state.hidden.includes(d.id);
const fitsMoment = (d, m) => m==="repas" ? d.group==="repas" : d.group!=="repas" && (d.moments||["petitdej"]).includes(m);

/* ============================================================
   3. Calculs
   ============================================================ */
/* Ingrédients réellement utilisés : les pâtes deviennent sans gluten si c'est le réglage choisi. */
function effIng(d){
  const ing = Object.assign({}, d.ing);
  if (state.pasta==="sg" && ing.pates!==undefined && items().pates_sg) { ing.pates_sg = (ing.pates_sg||0) + ing.pates; delete ing.pates; }
  return ing;
}
function nutOf(ing){
  const t = {}; NUT_KEYS.forEach(k=>t[k]=0);
  for (const [id,q] of Object.entries(ing)) {
    const it = items()[id]; if (!it) continue;
    const f = (it.unit==="g"||it.unit==="ml") ? q/100 : q;
    NUT_KEYS.forEach(k=>{ t[k] += (Number(it.nut[k])||0)*f; });
  }
  return t;
}
/* Prix au prorata du paquet : ce que coûte vraiment la portion, le reste du paquet sert ailleurs. */
function costOf(ing){
  let c = 0;
  for (const [id,q] of Object.entries(ing)) {
    const it = items()[id]; if (!it || !it.pack) continue;
    c += q/it.pack*(Number(it.price)||0);
  }
  return c;
}
const dishCost = d => costOf(effIng(d));
const hasGluten = d => Object.keys(effIng(d)).some(k=>items()[k] && items()[k].gluten);
const isRed = d => Object.keys(effIng(d)).some(k=>items()[k] && items()[k].red);
/* Jours de conservation de l'ingrédient le plus périssable (99 = rien de fragile). */
const shelf = d => Math.min(99, ...Object.keys(effIng(d)).map(k=>(items()[k] && items()[k].fresh) || 99));
/* Source de protéines principale (viande ou œufs), pour varier la semaine. */
function mainProt(d){
  let best = "", max = 0;
  for (const [k,q] of Object.entries(effIng(d))) {
    const it = items()[k]; if (!it || (it.cat!=="viande" && k!=="oeufs")) continue;
    const p = (Number(it.nut.p)||0)*((it.unit==="g"||it.unit==="ml") ? q/100 : q);
    if (p > max) { max = p; best = k; }
  }
  return best;
}
/* Féculents présents (toute quantité) ou sources de protéines qui apportent au moins 5 g à la portion. */
function famsOf(d, kind){
  const out = new Set();
  for (const [k,q] of Object.entries(effIng(d))) {
    const it = items()[k]; if (!it || !it.fam || !FAMS[kind].includes(it.fam) || !(q>0)) continue;
    if (kind==="proteine" && (Number(it.nut.p)||0)*((it.unit==="g"||it.unit==="ml") ? q/100 : q) < 5) continue;
    out.add(it.fam);
  }
  return out;
}
const MEAT = ["Poulet","Porc","Bœuf","Saumon"];
function tagsOf(d){
  const t = new Set(d.tags||[]);
  if (!hasGluten(d)) t.add("sansgluten");
  if (d.time && d.time<=15) t.add("rapide");
  if (isRed(d)) t.add("rouge");
  if (d.group!=="repas") for (const m of d.moments||["petitdej"]) t.add(m);
  return t;
}

function slotIng(ids){
  const ing = {};
  for (const id of ids) { const d = dishById(id); if (!d) continue;
    for (const [k,q] of Object.entries(effIng(d))) ing[k]=(ing[k]||0)+q; }
  return ing;
}
const dayIng = i => slotIng(state.plan[i]||[]);
const weekIng = () => slotIng(state.plan.flat());
const DAILY = {};
function recomputeDaily(){
  for (const k in DAILY) delete DAILY[k];
  for (const [k,q] of Object.entries(weekIng())) DAILY[k] = q/7;
}
function possible(d){
  let n = Infinity;
  const ing = effIng(d);
  if (!Object.keys(ing).length) return 0;
  for (const [k,q] of Object.entries(ing)) if (q>0) n = Math.min(n, Math.floor((state.stock[k]||0)/q));
  return n===Infinity ? 0 : n;
}
const daysLeft = k => DAILY[k] ? (state.stock[k]||0)/DAILY[k] : Infinity;

/* Dépense estimée : Mifflin-St Jeor, comme l'app Android. */
function maintenance(){
  const p = state.profile, kg = Number(p.kg)||60;
  const bmr = 10*kg + 6.25*(Number(p.cm)||165) - 5*(Number(p.age)||20) + (p.male ? 5 : -161);
  const stride = (Number(p.cm)||165)/100*(p.male ? 0.415 : 0.413);
  const steps = Math.max(0, (Number(p.steps)||0) - 3000) * 0.5*kg*stride/1000;
  const training = (MET[p.intensity] - 1)*kg*(Number(p.sessionMin)||0)/60*(Number(p.sessions)||0)/7;
  return {bmr, daily:bmr*0.2, steps, training, total:bmr*1.2 + steps + training};
}
function weekCost(){ return costOf(weekIng()); }
const monthOf = w => w*52/12;

/* ============================================================
   4. Semaine proposée automatiquement
   ============================================================ */
function shuffle(a){ for (let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; }
/* Le soir on cuisine 2 portions : la 2e fait le midi du lendemain. Les favoris d'abord, puis les moins chers,
   au plus une viande rouge, deux soirs au plus avec la même viande, les repas avec gluten plafonnés,
   et la viande fraîche en début de semaine (pas de congélateur). Les recettes retirées ne sortent jamais. */
function autoPlan(){
  const n = state.days;
  const meals = dishes().filter(d=>d.group==="repas" && Object.keys(d.ing).length && !isHidden(d)
    && (isFav(d) || !(d.tags||[]).some(t=>t==="plaisir"||t==="tester")));
  const byCost = meals.slice().sort((a,b)=>dishCost(a)-dishCost(b));
  const cheap = byCost.filter(d=>!isFav(d));
  const pool = [...shuffle(byCost.filter(isFav)), ...shuffle(cheap.slice(0, Math.max(10, Math.ceil(cheap.length*0.6))))];
  let gluten = 0, red = 0;
  const dinners = [];
  const fits = (d, portions) => (!hasGluten(d) || gluten+portions <= state.maxGluten) && (!isRed(d) || red<1)
    && (!mainProt(d) || dinners.filter(x=>mainProt(x)===mainProt(d)).length < 2);
  const add = d => { dinners.push(d); if (hasGluten(d)) gluten += 2; if (isRed(d)) red++; };
  /* au moins un soir de poulet, parmi les recettes de poulet les moins chères */
  const chicken = shuffle(byCost.filter(d=>["poulet","pilons"].includes(mainProt(d))).slice(0,4)).find(d=>fits(d,2));
  if (chicken) {
    add(chicken);
    /* sans congélateur, la barquette entamée doit être finie : un 2e soir avec la même viande si elle le permet */
    const left = freshLeft(dinners.map(d=>[d,2]));
    const again = shuffle(byCost.filter(d=>d!==chicken && mainProt(d)===mainProt(chicken)).slice(0,4))
      .find(d=>fits(d,2) && coveredBy(d, left, 2));
    if (again && n>1) add(again);
  }
  for (let i=dinners.length;i<n;i++) {
    /* un paquet frais peut être ouvert s'il n'en reste pas une portion entière à jeter */
    const noWaste = d => { const left = freshLeft([...dinners.map(x=>[x,2]), [d,2]]);
      return Object.entries(effIng(d)).every(([k,q])=>!(items()[k] && items()[k].fresh) || (left[k]||0) < q); };
    const pick = pool.find(d=>!dinners.includes(d) && fits(d,2) && noWaste(d))
      || pool.find(d=>!dinners.includes(d) && fits(d,2))
      || shuffle(byCost.slice()).find(d=>!dinners.includes(d) && fits(d,2))
      || byCost.find(d=>!hasGluten(d) && !isRed(d)) || byCost[0];
    if (!pick) break;
    add(pick);
  }
  dinners.sort((a,b)=>shelf(a)-shelf(b));
  /* lundi midi : de préférence de quoi finir une barquette entamée, sinon un plat à emporter sans viande fraîche en plus */
  const left = freshLeft(dinners.map((d,i)=>[d, i<n-1 ? 2 : 1]));
  const lunchOk = d => !dinners.includes(d) && (!hasGluten(d) || gluten+1 <= state.maxGluten) && coveredBy(d, left, 1);
  const lunch0 = byCost.find(d=>lunchOk(d) && Object.keys(effIng(d)).some(k=>left[k]>0))
    || shuffle(byCost.filter(d=>lunchOk(d) && (d.tags||[]).includes("emporter")).slice(0,5))[0]
    || byCost.find(lunchOk) || byCost.find(d=>!dinners.includes(d)) || dinners[0];
  /* petit-déj et goûter : favoris, puis ceux qui n'ajoutent pas de produit à acheter (wraps du sachet entamé…), puis le prix */
  const inWeek = new Set([lunch0, ...dinners].filter(Boolean).flatMap(d=>Object.keys(effIng(d))));
  const sides = (m, extraUsed, exclude=[]) => {
    const extra = d => Object.keys(effIng(d)).filter(k=>!inWeek.has(k) && !extraUsed.has(k)).length;
    const list = dishes().filter(d=>fitsMoment(d,m) && !isHidden(d) && !exclude.includes(d) && Object.keys(d.ing).length)
      .sort((a,b)=>(isFav(b)-isFav(a)) || (extra(a)-extra(b)) || (dishCost(a)-dishCost(b)));
    const picked = shuffle(list.slice(0,3));
    picked.forEach(d=>Object.keys(effIng(d)).forEach(k=>extraUsed.add(k)));
    return picked;
  };
  const used = new Set();
  const bf = sides("petitdej", used);
  const gt = sides("gouter", used, bf);
  return Array.from({length:n}, (_,i)=>[
    bf.length ? bf[i%bf.length].id : "",
    i===0 ? (lunch0 ? lunch0.id : "") : (dinners[i-1] ? dinners[i-1].id : ""),
    dinners[i] ? dinners[i].id : "",
    gt.length ? gt[(i+1)%gt.length].id : ""]);
}
/* Ce qui reste des paquets d'ingrédients frais une fois ces portions cuisinées : [[plat, portions], …] */
function freshLeft(list){
  const used = {};
  for (const [d,n] of list) for (const [k,q] of Object.entries(effIng(d)))
    if (items()[k] && items()[k].fresh) used[k] = (used[k]||0) + q*n;
  const left = {};
  for (const [k,u] of Object.entries(used)) { const p = items()[k].pack || 1; left[k] = Math.ceil(u/p - 1e-9)*p - u; }
  return left;
}
/* Le plat n'oblige à ouvrir aucun nouveau paquet frais. */
const coveredBy = (d, left, n) => Object.entries(effIng(d)).every(([k,q])=>!(items()[k] && items()[k].fresh) || (left[k]||0) >= q*n);

function resizePlan(){
  while (state.plan.length < state.days) state.plan.push(["","","",""]);
  for (const day of state.plan) while (day.length < 4) day.push("");
  state.plan.length = state.days;
}

function fmtQty(id, v){
  const it = items()[id]; if (!it) return nf(v);
  if (it.unit==="g") return v>=1000 ? nf(v/1000,2)+" kg" : nf(v)+" g";
  if (it.unit==="ml") return v>=1000 ? nf(v/1000,2)+" L" : nf(v)+" ml";
  if (it.unit==="pc") return nf(v,1)+(v>1?" pièces":" pièce");
  return nf(v)+" "+it.unit;
}
function el(tag, attrs={}, ...kids){
  const n = document.createElement(tag);
  for (const [a,v] of Object.entries(attrs)) {
    if (a==="class") n.className = v;
    else if (a.startsWith("on")) n.addEventListener(a.slice(2), v);
    else if (v!==false && v!=null) n.setAttribute(a, v===true?"":v);
  }
  for (const k of kids) if (k!=null) n.append(k);
  return n;
}

const TABS = [["recettes","Recettes"],["semaine","Semaine"],["courses","Courses"],["moi","Moi"]];

function go(tab){
  if (tab===view.tab && !view.page) { scrollTo({top:0, behavior:"smooth"}); return; }
  scrollMemo[viewKey()] = scrollY;
  view = {tab, page:null, arg:null};
  render(); scrollTo(0, scrollMemo[tab]||0);
}

}

   ============================================================ */
function cooked(d, n){
  const used = {};
  for (const [k,q] of Object.entries(effIng(d))) { used[k] = q*n; state.stock[k] = Math.max(0,(state.stock[k]||0)-q*n); }
  state.log.unshift({dish:d.id, t:Date.now(), n, ing:used});
  state.log = state.log.slice(0,40);
  save(); render(); toast(d.name+" ×"+n+" : retiré du stock");
}
function undo(i){
  const e = state.log[i];
  for (const [k,q] of Object.entries(e.ing||{})) state.stock[k] = (state.stock[k]||0)+q;
  state.log.splice(i,1);
  save(); render(); toast("Annulé, stock remis");
}
function toggleFav(d){
  state.favs = isFav(d) ? state.favs.filter(x=>x!==d.id) : [...state.favs, d.id];
  save(); render(); toast(isFav(d) ? "Ajoutée aux favoris : proposée en priorité" : "Retirée des favoris");
}
/* « Pas pour moi » : la recette disparaît de la liste, du planning et des propositions, mais reste restaurable. */
function hideDish(d){
  const inPlan = state.plan.some(day=>day.includes(d.id));
  if (!confirm("Retirer « "+d.name+" » ?\n\nElle ne sera plus affichée ni proposée"+(inPlan ? ", et sera enlevée du planning" : "")
    +". Tu pourras la remettre depuis Moi › Recettes mises de côté.")) return;
  state.hidden.push(d.id); state.favs = state.favs.filter(x=>x!==d.id);
  state.plan = state.plan.map(day=>day.map(id=>id===d.id ? "" : id));
  if (state.editDish===d.id) state.editDish = null;
  save(); toast(inPlan ? "Retirée, et enlevée du planning" : "Retirée, elle ne sera plus proposée");
  if (view.page==="recette") closePage(); else render();
}
function unhideDish(d){ state.hidden = state.hidden.filter(x=>x!==d.id); save(); render(); toast(d.name+" est de retour"); }
let cover = 7;
function buyList(){
  const rows = [];
  const week = weekIng();
  for (const k in items()) {
    const total = (week[k]||0)*cover/7;
    const need = total - (state.stock[k]||0);
    if (need <= 0) continue;
    const it = items()[k], pack = it.pack || 1;
    const packs = Math.ceil(need/pack - 1e-9);
    rows.push({k, packs, cost:packs*(it.price||0), left:packs*pack - need});
  }
  return rows;
}

function nutRef(k){
  const info = NUT_INFO[k]; const p = state.profile;
  if (k==="ca" && p.age<25) return 1000;
  return p.male ? info[2] : info[3];
}
/* Bloc replié : vitamines et minéraux, avec les macros en tête si demandé. */
function nutPanel(t, label, key, withMacros=false){
  const grid = el("div",{class:"micro"});
  for (const k of MICRO_ORDER) {
    const [name,unit] = NUT_INFO[k]; const ref = nutRef(k);
    const pct = ref ? Math.round(t[k]/ref*100) : 0;
    grid.append(el("div",{class:"micro-row"},
      el("span",{}, name),
      el("span",{class:"micro-val"}, nf(t[k], t[k]<10?1:0)+" "+unit),
      el("span",{class:"micro-bar","aria-hidden":"true"}, el("i",{style:"width:"+Math.min(pct,100)+"%"})),
      el("span",{class:"micro-pct"}, pct+" %")));
  }
  return el("details",{class:"fold", "data-key":key}, el("summary",{}, label, icon("down",20)),
    el("div",{class:"fold-body"}, withMacros ? macroLine(t) : null, grid,
      el("p",{class:"micro-note"},"Pourcentages des références ANSES par jour pour "+(state.profile.male?"un homme":"une femme")+" adulte. Poids crus.")));
}

/* ============================================================
   9. Onglet Recettes
   ============================================================ */
let group = "repas", moment = "", sortBy = "prix", fecFilter = "", protFilter = "", recipeQuery = "";
const extra = new Set();
const EXTRAS = [["favoris","★ Favoris"],["pascher","Pas chères"],["rapide","Rapides"],["sansgluten","Sans gluten"],
  ["airfryer","Air fryer"],["emporter","À emporter"],["plaisir","Plaisir"],["tester","À tester"]];
const SORTS = [["prix","moins chères"],["temps","plus rapides"],["kcal","moins caloriques"],["prot","plus de protéines"]];

const inGroup = d => (group==="repas") === (d.group==="repas");
function matchesFam(d){
  if (fecFilter) { const f = famsOf(d,"feculent");
    if (fecFilter==="-" ? f.size : !f.has(fecFilter)) return false; }
  if (protFilter) { const f = famsOf(d,"proteine");
    if (protFilter==="-" ? MEAT.some(m=>f.has(m)) : !f.has(protFilter)) return false; }
  return true;
}
function matchesFilters(d){
  if (!matchesFam(d)) return false;
  if (group!=="repas" && moment && !fitsMoment(d, moment)) return false;
  for (const t of extra)
    if (t==="favoris" ? !isFav(d) : t==="pascher" ? dishCost(d) > CHEAP : !tagsOf(d).has(t)) return false;
  return true;
}
const visibleRecipes = () => dishes().filter(d=>!isHidden(d) && inGroup(d) && matchesFilters(d));
const activeFilters = () => (fecFilter?1:0) + (protFilter?1:0) + extra.size + (group!=="repas" && moment ? 1 : 0);
function clearFilters(){ fecFilter = protFilter = moment = ""; extra.clear(); }
function sorter(a,b){
  if (sortBy==="prot") return nutOf(effIng(b)).p - nutOf(effIng(a)).p;
  if (sortBy==="kcal") return nutOf(effIng(a)).kcal - nutOf(effIng(b)).kcal;
  if (sortBy==="temps") return (a.time||99) - (b.time||99);
  return dishCost(a) - dishCost(b);
}
const momentsLabel = d => (d.moments||["petitdej"]).map((m,i)=>i ? TAGS[m].toLowerCase() : TAGS[m]).join(", ");

function newDish(){
  const id = newId("recette", x=>dishById(x));
  state.dishes.push({id, name:"Nouvelle recette", group:group==="repas" ? "repas" : "petitdej", moments:group==="repas" ? undefined : ["petitdej","gouter"],
    time:20, tags:[], ing:{}, steps:[]});
  openEditor(id);
}
function duplicateDish(d){
  const id = newId(d.id+"_copie", x=>dishById(x));
  const copy = Object.assign(clone(d), {id, name:d.name+" (copie)"});
  state.dishes.splice(state.dishes.indexOf(d)+1, 0, copy);
  openEditor(id); toast("Copie créée, modifie-la à ton goût");
}
function deleteDish(d){
  if (!confirm("Supprimer définitivement « "+d.name+" » ?")) return;
  state.dishes = state.dishes.filter(x=>x.id!==d.id);
  state.plan = state.plan.map(day=>day.map(id=>id===d.id ? "" : id));
  state.favs = state.favs.filter(x=>x!==d.id); state.hidden = state.hidden.filter(x=>x!==d.id);
  state.editDish = null;
  save(); toast("Recette supprimée"); closePage();
}
/* Ouvre une recette en mode édition, dans la page déjà ouverte si c'est le cas. */
function openEditor(id){
  state.editDish = id; save();
  if (view.page==="recette") { view.arg = id; render(); scrollTo(0,0); }
  else openPage("recette", id);
  const name = document.querySelector("#tab-page .fields input[type=text]");
  if (name && dishById(id).name.startsWith("Nouvelle")) { name.focus({preventScroll:true}); name.select(); }
}

function renderRecettes(){
  const root = document.getElementById("tab-recettes"); root.replaceChildren();
  root.append(el("div",{class:"head"}, el("h1",{},"Recettes"),
    el("button",{class:"icon-btn solid", "aria-label":"Nouvelle recette", onclick:newDish}, icon("plus"))));
  const search = el("input",{type:"search", placeholder:"Chercher une recette", "aria-label":"Chercher une recette", value:recipeQuery, enterkeyhint:"search"});
  const list = el("div",{});
  search.addEventListener("input", e=>{ recipeQuery = e.target.value; drawRecipeList(list); });
  const n = activeFilters();
  root.append(el("div",{class:"toolbar"},
    el("label",{class:"search"}, icon("search",20), search),
    el("button",{class:"btn soft", onclick:()=>openSheet({kind:"filtres"})}, icon("filtres",20), "Filtres", n ? el("span",{class:"count"}, String(n)) : null)));
  root.append(el("div",{class:"seg", role:"tablist", "aria-label":"Type de recette"},
    ...[["repas","Repas"],["petitdej","Petit-déj et goûter"]].map(([g,l])=>
      el("button",{role:"tab", "aria-selected":String(group===g), onclick:()=>{ if (group!==g) { group = g; moment = ""; render(); } }}, l))));
  root.append(list);
  drawRecipeList(list);
}
function drawRecipeList(list){
  list.replaceChildren();
  const all = visibleRecipes();
  const q = norm(recipeQuery.trim());
  const shown = all.filter(d=>!q || norm(d.name).includes(q)).sort(sorter);
  const count = n => group==="repas" ? n+" repas" : n+(n>1 ? " petits-déj et goûters" : " petit-déj ou goûter");
  const sort = selectInput(SORTS, sortBy, v=>{ sortBy = v; render(); });
  sort.setAttribute("aria-label","Trier les recettes");
  list.append(el("div",{class:"caption"}, el("span",{}, q ? shown.length+" sur "+count(all.length) : count(all.length)),
    el("label",{class:"sort"},"Trier :", sort)));

  const chips = [];
  if (fecFilter) chips.push([fecFilter==="-" ? "Sans féculent" : fecFilter, ()=>{ fecFilter = ""; }]);
  if (protFilter) chips.push([protFilter==="-" ? "Sans viande ni poisson" : protFilter, ()=>{ protFilter = ""; }]);
  if (group!=="repas" && moment) chips.push([TAGS[moment], ()=>{ moment = ""; }]);
  for (const t of extra) chips.push([EXTRAS.find(x=>x[0]===t)[1], ()=>{ extra.delete(t); }]);
  if (chips.length) list.append(el("div",{class:"chips"}, ...chips.map(([l,off])=>
    el("button",{class:"chip on", "aria-label":"Enlever le filtre "+l, onclick:()=>{ off(); render(); }}, l, icon("close",16)))));

  const favs = shown.filter(isFav), rest = shown.filter(d=>!isFav(d));
  if (favs.length) list.append(el("h2",{class:"sec"},"Tes favoris"), el("div",{class:"group"}, ...favs.map(recipeRow)));
  if (rest.length) {
    if (favs.length) list.append(el("h2",{class:"sec"}, group==="repas" ? "Toutes les autres" : "Tous les autres"));
    else list.append(el("div",{style:"height:8px"}));
    list.append(el("div",{class:"group"}, ...rest.map(recipeRow)));
  }
  if (!shown.length) list.append(el("div",{class:"empty-box"},
    el("p",{}, q ? "Aucune recette ne s'appelle comme ça." : "Aucune recette avec ces filtres."),
    activeFilters() ? el("button",{class:"btn", onclick:()=>{ clearFilters(); render(); }},"Enlever les filtres") : null));
}
function recipeRow(d){
  const t = nutOf(effIng(d)), tags = tagsOf(d);
  const meta = [];
  if (d.group!=="repas") meta.push(momentsLabel(d));
  if (d.time) meta.push(d.time+" min");
  meta.push(nf(t.kcal)+" kcal");
  const warn = tags.has("tester") ? "À tester" : tags.has("plaisir") ? "Plus cher" : tags.has("rouge") ? "Viande rouge" : null;
  return el("button",{class:"row", onclick:()=>openPage("recette", d.id)},
    el("span",{class:"row-main"}, el("span",{class:"row-title"}, d.name), el("span",{class:"row-sub"}, meta.join(" · ")),
      warn ? el("span",{class:"badge"}, warn) : null),
    el("span",{class:"row-price"}, el("b",{}, eur(dishCost(d))), el("span",{},"la portion")));
}

function filtresSheet(box){
  const visible = dishes().filter(d=>!isHidden(d) && inGroup(d));
  const famChips = (kind, cur, set, none) => {
    const opts = [["", kind==="feculent" ? "Tous" : "Toutes"]];
    for (const f of FAMS[kind]) if (visible.some(d=>famsOf(d,kind).has(f))) opts.push([f,f]);
    opts.push(["-", none]);
    return opts.map(([v,l])=>el("button",{class:"chip", "aria-pressed":String(cur===v), onclick:()=>{ set(cur===v ? "" : v); render(); }}, l));
  };
  const groups = [];
  if (group!=="repas") groups.push(["Moment", null, [["","Tous"],["petitdej","Petit-déj"],["gouter","Goûter"]].map(([v,l])=>
    el("button",{class:"chip", "aria-pressed":String(moment===v), onclick:()=>{ moment = v; render(); }}, l))]);
  groups.push(["Féculent","Un seul choix, par exemple seulement les pâtes.", famChips("feculent", fecFilter, v=>{ fecFilter = v; }, "Sans féculent")]);
  groups.push(["Protéine","La viande, le poisson ou ce qui les remplace.", famChips("proteine", protFilter, v=>{ protFilter = v; }, "Sans viande ni poisson")]);
  groups.push(["Et aussi","Plusieurs choix possibles.", EXTRAS.map(([t,l])=>
    el("button",{class:"chip", "aria-pressed":String(extra.has(t)), onclick:()=>{ if (extra.has(t)) extra.delete(t); else extra.add(t); render(); }}, l))]);
  const n = visibleRecipes().length;
  box.append(el("div",{class:"grab","aria-hidden":"true"}),
    el("div",{class:"sheet-head"},
      el("button",{class:"icon-btn", "aria-label":"Fermer", onclick:closeSheet}, icon("close")),
      el("h2",{id:"sheet-title"},"Filtres"),
      el("button",{class:"link", style:"justify-self:end", onclick:()=>{ clearFilters(); render(); }},"Effacer")),
    el("div",{class:"sheet-body"}, ...groups.map(([title,hint,chips])=>
      el("fieldset",{class:"fgroup"}, el("legend",{}, title), hint ? el("p",{class:"hint"}, hint) : null, el("div",{class:"chips"}, ...chips)))),
    el("div",{class:"sheet-foot"}, el("button",{class:"btn primary block", onclick:closeSheet},
      n ? "Voir "+(n>1 ? n+" recettes" : "la recette") : "Aucune recette, enlève un filtre")));
}

/* ---------- Page d'une recette ---------- */
const portions = {};
function renderRecettePage(root){
  const d = dishById(view.arg);
  if (!d) { root.append(topbar(), el("p",{class:"empty"},"Cette recette n'existe plus.")); return; }
  const editing = state.editDish===d.id;

      el("output",{"aria-live":"polite", "aria-label":n+" portions"}, String(n)),

    return el("li",{}, el("span",{class:"q"}, fmtQty(k, q*n)), el("span",{class:"n"}, itemName(k)),

function dishEditor(d){
  const box = el("div",{class:"fields editor"});
  box.append(field("Nom", textInput(d.name, v=>{ if (v) d.name = v; save(); render(); }), "wide"));
  box.append(field("Catégorie", selectInput([["repas","Repas"],["petitdej","Petit-déj ou goûter"]], d.group==="repas"?"repas":"petitdej",
    v=>{ d.group = v; if (v!=="repas" && !d.moments) d.moments = ["petitdej","gouter"]; save(); render(); })));
  box.append(field("Temps (min)", numInput(d.time||0, v=>{ d.time = v; save(); render(); }, {step:"1"})));

  const toggles = [];
  if (d.group!=="repas") for (const m of ["petitdej","gouter"]) {
    const on = (d.moments||[]).includes(m);
    toggles.push(el("button",{class:"chip", "aria-pressed":String(on), onclick:()=>{
      d.moments = (d.moments||[]).filter(x=>x!==m); if (!on) d.moments.push(m); save(); render(); }}, TAGS[m]));
  }
  for (const t of ["airfryer","emporter","plaisir","tester"]) {
    const on = (d.tags||[]).includes(t);
    toggles.push(el("button",{class:"chip", "aria-pressed":String(on), onclick:()=>{
      d.tags = (d.tags||[]).filter(x=>x!==t); if (!on) d.tags.push(t); save(); render(); }}, TAGS[t]));
  }
  box.append(el("div",{class:"wide"}, el("div",{class:"sep", style:"margin:0 0 8px"},"Étiquettes"), el("div",{class:"chips"}, ...toggles)));

  box.append(el("div",{class:"sep"},"Ingrédients pour une portion"));
  const rows = el("div",{class:"wide ing-edit"});
  for (const [k,q] of Object.entries(d.ing)) {
    const it = items()[k];
    const qty = numInput(q, v=>{ if (v>0) d.ing[k]=v; else delete d.ing[k]; save(); render(); });
    qty.setAttribute("aria-label", "Quantité de "+itemName(k));
    rows.append(el("div",{class:"ing-row"},
      el("span",{class:"ing-name"}, itemName(k)),
      el("span",{class:"qty"}, qty, it ? (it.unit==="pc" ? "pièce" : it.unit) : "?"),
      el("span",{class:"ing-cost"}, it && it.pack ? eur(q/it.pack*(it.price||0)) : "?"),
      el("button",{class:"remove", "aria-label":"Retirer "+itemName(k), onclick:()=>{ delete d.ing[k]; save(); render(); }}, icon("close",18))));
  }
  if (!Object.keys(d.ing).length) rows.append(el("p",{class:"empty"},"Ajoute un premier ingrédient ci-dessous."));
  box.append(rows);
  const add = el("select",{}, el("option",{value:""},"Ajouter un ingrédient…"),
    ...Object.entries(items()).filter(([k])=>d.ing[k]===undefined).sort((a,b)=>a[1].name.localeCompare(b[1].name,"fr"))
      .map(([k,it])=>el("option",{value:k}, it.name)),
    el("option",{value:"+"},"+ Créer un nouvel aliment…"));
  add.addEventListener("change", e=>{
    let k = e.target.value; if (!k) return;
    if (k==="+") {
      const name = (prompt("Nom du nouvel aliment ?")||"").trim();
      if (!name) { e.target.value = ""; return; }
      k = createItem(name);
      toast("« "+name+" » créé : mets son prix dans Moi › Aliments et prix");
    }
    d.ing[k] = items()[k].unit==="pc" ? 1 : 100; save(); render();
  });
  box.append(field("Ajouter", add, "wide"));

  const steps = el("textarea",{"aria-label":"Étapes"}); steps.value = (d.steps||[]).join("\n");
  steps.addEventListener("change", e=>{ const v = e.target.value; setTimeout(()=>{ d.steps = v.split("\n").map(s=>s.trim()).filter(Boolean); save(); render(); }); });
  box.append(field("Étapes, une par ligne", steps, "wide"));

  box.append(el("div",{class:"row-btns wide"},
    el("button",{class:"btn", onclick:()=>duplicateDish(d)}, icon("copy",18), "Dupliquer"),
    el("button",{class:"btn danger", onclick:()=>deleteDish(d)},"Supprimer")));
  return box;
}

function budgetCard(){
  const w = weekCost(), m = monthOf(w), left = state.budget - m;
  const pct = state.budget ? Math.min(100, m/state.budget*100) : 100;
  return el("div",{class:"card"},
    el("div",{class:"budget-top"},
      el("div",{}, el("small",{},"Cette semaine"), el("div",{class:"budget-week"}, eur(w))),
      el("div",{class:"budget-month"}, el("small",{},"Sur un mois"), "≈ "+eur0(m)+" ", el("span",{},"/ "+eur0(state.budget)))),
    el("div",{class:"bar", role:"img", "aria-label":Math.round(pct)+" % du budget du mois"}, el("i",{class:left<0?"over":"", style:"width:"+pct+"%"})),
    left>=0
      ? el("p",{}, "Il te reste environ ", el("b",{}, eur0(left)), " pour autre chose ou pour l'épargne.")
      : el("p",{class:"warn"}, "Dépasse le budget de "+eur0(-left)+" : remplace un plat par un moins cher."));
}
function renderSemaine(){
  const root = document.getElementById("tab-semaine"); root.replaceChildren();
  root.append(el("div",{class:"head"}, el("h1",{},"Semaine"),
    el("button",{class:"btn", onclick:()=>{ state.plan = autoPlan(); save(); render(); toast("Nouvelle semaine proposée"); }}, icon("refresh",18), "Autre semaine")));
  root.append(budgetCard());
  root.append(el("div",{class:"setting"},
    el("div",{}, el("div",{class:"card-label"},"Jours à prévoir"), el("p",{class:"hint"},"5 si tu rentres le week-end")),

    el("div",{class:"fold-body"}, el("p",{class:"hint", style:"font-size:.9rem"},
      "Tes favoris d'abord, puis les plats les moins chers. Au moins un soir de poulet, la viande fraîche en début de semaine (pas de congélateur), au plus une viande rouge, "
      +state.maxGluten+" repas avec gluten maximum. Le plat du soir se cuisine en 2 portions : la 2e fait le midi du lendemain."))));
  root.append(el("p",{class:"note"},"Tes besoins estimés : environ "+nf(Math.round(maintenance().total/50)*50)+" kcal par jour, sans compter grignotages et boissons."));
}
function dayCard(day, i){
  const ing = dayIng(i), t = nutOf(ing), any = day.some(id=>dishById(id));
  const sec = el("section",{class:"day"}, el("div",{class:"day-head"}, el("h2",{}, DAYS[i]),
    el("span",{}, any ? eur(costOf(ing))+" · "+nf(t.kcal)+" kcal" : "Rien de prévu")));
  for (const [lab,j,m] of SLOTS) {
    const d = dishById(day[j]);
    let badge = null;
    if (j===1 && i>0 && day[1] && day[1]===state.plan[i-1][2]) badge = el("span",{class:"badge ok"},"Reste d'hier soir");

function platSheet(box){

function drawPlatList(list){
  const {day:i, slot:j, m} = sheet;
  const cur = state.plan[i][j], q = norm((sheet.q||"").trim());
  const opts = dishes().filter(d=>fitsMoment(d,m) && (!isHidden(d) || d.id===cur) && (!q || norm(d.name).includes(q)))
    .sort((a,b)=>(isFav(b)-isFav(a)) || dishCost(a)-dishCost(b));
  const groups = [];
  if (q) groups.push(["Résultats", opts]);
  else {
    const curD = dishById(cur), rest = opts.filter(d=>d.id!==cur);
    groups.push(["Choix actuel", curD ? [curD, null] : [null]]);
    if (rest.some(isFav)) groups.push(["Tes favoris", rest.filter(isFav)]);
    groups.push(["Les moins chères d'abord", rest.filter(d=>!isFav(d))]);
  }
  list.replaceChildren();
  for (const [title, ds] of groups) if (ds.length)
    list.append(el("h3",{class:"sec"}, title), el("div",{class:"group flat"}, ...ds.map(d=>{
      const on = d ? d.id===cur : !cur;
      const meta = d ? [d.time ? d.time+" min" : null, hasGluten(d) ? "avec gluten" : null].filter(Boolean).join(" · ") : "Chez tes parents, à la cantine…";
      return el("button",{class:"row", role:"radio", "aria-checked":String(on), onclick:()=>pickDish(d ? d.id : "")},
        el("span",{class:"row-main"}, el("span",{class:"row-title"}, d ? d.name : "Rien, je mange ailleurs"), meta ? el("span",{class:"row-sub"}, meta) : null),
        el("span",{class:"row-price"}, el("b",{}, d ? eur(dishCost(d)) : "0 €")),
        el("span",{class:"radio","aria-hidden":"true"}, on ? icon("check",14) : null));
    })));
  if (q && !opts.length) list.append(el("p",{class:"empty", style:"padding-top:16px"},"Aucun plat ne correspond."));
}
/* Changer le soir change aussi le midi du lendemain quand c'en était le reste. */
function pickDish(id){
  const {day:i, slot:j} = sheet, old = state.plan[i][j];
  state.plan[i][j] = id;
  let msg = null;
  if (j===2 && old && old!==id && state.plan[i+1] && state.plan[i+1][1]===old) { state.plan[i+1][1] = id; msg = DAYS[i+1]+" midi suit aussi"; }
  save(); closeSheet();
  if (msg) toast(msg);
}

/* Ajoute au stock ce qui est coché, ou toute la liste si rien n'est coché. */
function doneShopping(rows){
  const cart = new Set(state.cart);
  const picked = rows.filter(r=>cart.has(r.k));
  if (picked.length && picked.length<rows.length && !confirm("Ajouter au stock seulement les "+picked.length+" articles cochés ?")) return;
  const list = picked.length ? picked : rows;
  for (const r of list) state.stock[r.k] = (state.stock[r.k]||0) + r.packs*(items()[r.k].pack||0);
  state.cart = [];
  save(); render(); toast(list.length+(list.length>1 ? " articles ajoutés" : " article ajouté")+" au stock");
}

let foodQuery = "";
function createItem(name){
  const id = newId(name || "aliment", x=>items()[x]);
  const nut = {}; NUT_KEYS.forEach(n=>nut[n]=0);
  state.items[id] = {name:name || "Nouvel aliment", unit:"g", cat:"epicerie", pack:500, packLabel:"500 g", price:0, fam:"", nut};
  state.stock[id] = 0;
  openKeys.add("food-"+id);
  return id;
}
function deleteItem(k){
  const it = items()[k];
  const used = dishes().filter(d=>d.ing[k]!==undefined);
  const msg = used.length
    ? "« "+it.name+" » est dans "+used.length+(used.length>1?" recettes":" recette")+" ("+used.map(d=>d.name).slice(0,4).join(", ")+(used.length>4?"…":"")+"). Le retirer de ces recettes et le supprimer ?"
    : "Supprimer « "+it.name+" » ?";
  if (!confirm(msg)) return;
  for (const d of used) delete d.ing[k];
  delete state.items[k]; delete state.stock[k];
  state.cart = state.cart.filter(x=>x!==k);
  save(); render(); toast("Aliment supprimé");
}

  root.append(topbar(el("button",{class:"btn primary", onclick:()=>{
    const name = (prompt("Nom du nouvel aliment ?")||"").trim(); if (!name) return;
    const id = createItem(name); foodQuery = ""; save(); render();

    toast("Complète son prix, son format et ses valeurs");

  const list = el("div",{});

  root.append(el("div",{class:"toolbar"}, el("label",{class:"search"}, icon("search",20), search)), list);
  drawFoods(list);

function drawFoods(list){
  list.replaceChildren();
  const q = norm(foodQuery.trim());
  let any = false;
  for (const c of CATS) {
    const rows = Object.entries(items()).filter(([,it])=>it.cat===c.id && (!q || norm(it.name).includes(q)))
      .sort((a,b)=>a[1].name.localeCompare(b[1].name,"fr"));
    if (!rows.length) continue;
    any = true;
    list.append(el("h2",{class:"sec"}, c.name), el("div",{class:"group"}, ...rows.map(([k,it])=>foodBlock(k,it))));
  }
  if (!any) list.append(el("div",{class:"empty-box"}, el("p",{},"Aucun aliment ne correspond. Crée-le avec « + Aliment » en haut.")));
}
function pricePer(it){
  if (!it.pack) return "";
  if (it.unit==="g") return eur(it.price/it.pack*1000)+" le kg";
  if (it.unit==="ml") return eur(it.price/it.pack*1000)+" le litre";
  return eur(it.price/it.pack)+" la pièce";
}
function famInput(it){
  const s = el("select",{}, el("option",{value:"", selected:!it.fam},"Aucune"),
    ...[["feculent","Féculents"],["proteine","Protéines"]].map(([kind,lab])=>
      el("optgroup",{label:lab}, ...FAMS[kind].map(f=>el("option",{value:f, selected:it.fam===f}, f)))));
  s.addEventListener("change", e=>{ it.fam = e.target.value; save(); render(); });
  return s;
}
function foodBlock(k, it){
  const per = (it.unit==="g"||it.unit==="ml") ? "pour 100 "+it.unit : "par pièce";
  const used = dishes().filter(d=>d.ing[k]!==undefined);
  const det = el("details",{class:"food", "data-key":"food-"+k},
    el("summary",{}, it.name, el("span",{}, eur(it.price)+" · "+it.packLabel)));
  const box = el("div",{class:"fields"});

  box.append(field("Nom", textInput(it.name, v=>{ if (v) it.name = v; save(); render(); }), "wide"));
  box.append(field("Prix du format (€)", numInput(it.price, v=>{ it.price = v; save(); render(); })));
  box.append(field("Format ("+unitLabel(it.unit)+")", numInput(it.pack, v=>{ it.pack = v; save(); render(); })));
  box.append(field("Nom du format", textInput(it.packLabel, v=>{ it.packLabel = v; save(); render(); }), "wide"));
  box.append(el("p",{class:"wide hint"}, pricePer(it)));
  box.append(field("Unité", selectInput([["g","g"],["ml","ml"],["pc","pièce"]], it.unit, v=>{ it.unit = v; save(); render(); })));
  box.append(field("Rayon", selectInput(CATS.map(c=>[c.id,c.name]), it.cat, v=>{ it.cat = v; save(); render(); })));
  box.append(field("Famille (filtres)", famInput(it)));
  box.append(field("Gluten", selectInput([["0","Sans"],["1","Contient du gluten"]], it.gluten?1:0, v=>{ it.gluten = v==="1"; save(); render(); })));
  box.append(field("Se garde au frigo (jours, 0 = longtemps)", numInput(it.fresh||0, v=>{ it.fresh = v>0 ? v : 0; save(); render(); }, {step:"1"}), "wide"));

  const nut = el("div",{class:"fields"});
  for (const n of NUT_KEYS) {
    const [label,unitN] = NUT_INFO[n];
    nut.append(field(label+" ("+unitN+")", numInput(it.nut[n], v=>{ it.nut[n]=v; save(); render(); })));
  }
  box.append(el("details",{class:"fold", "data-key":"foodnut-"+k}, el("summary",{},"Valeurs "+per, icon("down",20)), el("div",{class:"fold-body"}, nut)));
  box.append(el("p",{class:"wide hint"}, used.length
    ? "Dans "+used.length+(used.length>1?" recettes : ":" recette : ")+used.map(d=>d.name).join(", ")
    : "Dans aucune recette pour l'instant."));
  box.append(el("div",{class:"row-btns wide"}, el("button",{class:"btn danger", onclick:()=>deleteItem(k)},"Supprimer cet aliment")));

  det.append(box);
  return det;
}

/* ============================================================
   13. Panneaux du bas
   ============================================================ */
function drawSheet(){
  const host = document.getElementById("tab-sheet");
  const prev = host.querySelector(".sheet-body");
  const top = prev ? prev.scrollTop : 0;
  document.body.classList.toggle("sheet-open", !!sheet);
  host.hidden = !sheet; host.replaceChildren();
  if (!sheet) return;
  const box = el("div",{class:"sheet", role:"dialog", "aria-modal":"true", "aria-labelledby":"sheet-title", tabindex:"-1"});
  host.append(el("div",{class:"sheet-back", onclick:e=>{ if (e.target===e.currentTarget) closeSheet(); }}, box));
  (sheet.kind==="filtres" ? filtresSheet : platSheet)(box);
  const body = box.querySelector(".sheet-body"); if (body) body.scrollTop = top;
  if (sheet.fresh) { sheet.fresh = false; box.focus({preventScroll:true}); }
}

   14. Démarrage
   ============================================================ */
/* Position d'un nœud dans son écran, pour retrouver son équivalent une fois l'écran redessiné. */
function pathOf(node){
  const p = [];
  while (node && node.parentElement && !(node.id||"").startsWith("tab-")) { p.unshift([...node.parentElement.children].indexOf(node)); node = node.parentElement; }
  return node && (node.id||"").startsWith("tab-") ? {root:node.id, p} : null;
}
function nodeAt(loc){
  let n = document.getElementById(loc.root);
  for (const i of loc.p) { if (!n) return null; n = n.children[i]; }
  return n;
}
const openKeys = new Set();
function render(){
  if (soft && typing()) { pendingRender = true; return; }
  pendingRender = false;
  const open = new Set([...openKeys, ...[...document.querySelectorAll("details[data-key][open]")].map(x=>x.dataset.key)]);
  openKeys.clear();
  const act = document.activeElement;
  /* dans un panneau, on garde aussi le focus sur la pastille touchée */
  const keep = act && (/^(INPUT|SELECT|TEXTAREA)$/.test(act.tagName) || (act.tagName==="BUTTON" && act.closest("#tab-sheet")));
  const focus = keep ? pathOf(act) : null;
  draw();
  document.querySelectorAll("details[data-key]").forEach(x=>{ if (open.has(x.dataset.key)) x.open = true; });
  if (focus) { const n = nodeAt(focus);
    if (n && n.tagName===act.tagName && n.type===act.type) n.focus({preventScroll:true}); }
}
const PAGES = {recette:renderRecettePage, profil:renderProfilPage, preferences:renderPrefsPage, stock:renderStockPage,
  aliments:renderAlimentsPage, retirees:renderRetireesPage, historique:renderHistoriquePage, sauvegarde:renderSauvegardePage};
function draw(){
  recomputeDaily();
  for (const [t] of TABS) document.getElementById("tab-"+t).hidden = !!view.page || t!==view.tab;
  const page = document.getElementById("tab-page");
  page.hidden = !view.page; page.replaceChildren();
  document.body.classList.toggle("paged", !!view.page);
  document.body.classList.toggle("with-total", !view.page && view.tab==="courses");
  document.querySelectorAll("#tabbar button").forEach(b=>b.setAttribute("aria-current", !view.page && b.dataset.tab===view.tab ? "page" : "false"));
  if (view.page) PAGES[view.page](page);
  else ({recettes:renderRecettes, semaine:renderSemaine, courses:renderCourses, moi:renderMoi})[view.tab]();
  drawSheet();
}
