<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Suical</title>
<meta name="theme-color" content="#15302A">
<meta name="description" content="Recettes simples et pas chères, avec le prix de chaque plat, le budget du mois et les apports nutritionnels. Hors ligne.">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF2EF; --surface:#FFFFFF; --ink:#15302A; --muted:#5B6E68; --line:#D3DDD8;
  --yolk:#F2B705; --yolk-ink:#15302A; --tomato:#C8412F; --tomato-bg:#FBE9E6; --ok:#2F7A5B;
  --font:"Archivo","Helvetica Neue",Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1E1B; --surface:#162925; --ink:#E4EEEA; --muted:#93A7A0; --line:#28403A;
    --tomato:#F06A55; --tomato-bg:#3A1F1B; --ok:#6CC49D;
  }
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit;box-sizing:border-box}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--yolk);outline-offset:2px}
h1{margin:0;font-size:1.45rem;font-weight:800;font-stretch:78%;line-height:1.1}
h2{font-size:1.02rem;font-weight:700;margin:24px 0 8px;color:var(--muted)}
h2:first-child{margin-top:4px}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.head-inner{max-width:760px;margin:0 auto;padding:12px 16px 0}
.sub{font-size:.78rem;color:var(--muted);margin-top:2px}
nav{display:flex;gap:2px;margin-top:10px;overflow-x:auto;-webkit-overflow-scrolling:touch}
nav button{flex:1 0 auto;border:0;background:none;padding:9px 9px 11px;font-weight:600;font-size:.92rem;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
nav button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--yolk)}

main{max-width:760px;margin:0 auto;padding:14px 16px 56px}
section[hidden]{display:none}
.empty{color:var(--muted);font-size:.9rem;padding:8px 0}
.intro{margin:4px 0 0;color:var(--muted);font-size:.9rem}
.link{border:0;background:none;color:var(--ink);text-decoration:underline;text-underline-offset:3px;padding:4px 0;font-weight:600}
.primary{border:0;background:var(--ink);color:var(--bg);border-radius:999px;padding:10px 18px;font-weight:700}
.ghost{border:1px solid var(--ink);background:none;border-radius:999px;padding:8px 14px;font-weight:600;font-size:.88rem}
.danger{border:1px solid var(--tomato);color:var(--tomato);background:none;border-radius:999px;padding:8px 14px;font-weight:600;font-size:.88rem}
.row-btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.hint{font-size:.8rem;color:var(--muted)}
.log-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:.9rem}
.log-row time{color:var(--muted);font-size:.8rem;margin-left:6px}

/* recettes */
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.84rem;font-weight:600}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px;font-size:.88rem}
.controls select{width:auto}
.controls input[type=search]{flex:1;min-width:0}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.ing-edit{display:grid;gap:6px}
.ing-row{display:grid;grid-template-columns:1fr auto auto 32px;gap:8px;align-items:center;font-size:.88rem}
.ing-row .qty input{width:72px}
.ing-cost{color:var(--muted);font-variant-numeric:tabular-nums;min-width:48px;text-align:right}
.remove{border:1px solid var(--line);background:var(--surface);border-radius:999px;width:32px;height:32px;padding:0;font-size:1.1rem;line-height:1;color:var(--tomato)}
.rec{padding:14px 0;border-bottom:1px solid var(--line)}
.rec-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.rec-name{font-weight:700;font-size:1.02rem;line-height:1.25}
.rec-meta{font-size:.84rem;color:var(--muted);margin-top:3px}
.price{flex:none;background:var(--yolk);color:var(--yolk-ink);border-radius:12px;padding:6px 10px;text-align:center;min-width:74px}
.price b{display:block;font-size:1.4rem;font-weight:800;font-stretch:68%;line-height:1.05;font-variant-numeric:tabular-nums}
.price span{font-size:.68rem;font-weight:600}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.tag{font-size:.72rem;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.tag.warn{color:var(--tomato);border-color:transparent;background:var(--tomato-bg)}
.ing-list{list-style:none;padding:0;margin:6px 0 12px;font-size:.88rem}
.ing-list li{display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-bottom:1px dashed var(--line)}
.ing-list li span:last-child{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.steps{margin:0 0 6px;padding-left:20px;font-size:.9rem}
.steps li{margin-bottom:6px}
.fav{border:1px solid var(--ink);background:none;border-radius:999px;width:38px;height:34px;font-size:1.1rem;line-height:1;padding:0}
.fav[aria-pressed="true"]{background:var(--yolk);border-color:var(--yolk);color:var(--yolk-ink)}
.star{color:var(--yolk)}
.cook{border:2px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:999px;padding:6px 14px;font-weight:700;font-size:.88rem}

/* nutrition */
.nut{margin-top:8px}
.nut summary{cursor:pointer;font-size:.86rem;font-weight:600;padding:4px 0;list-style-position:inside}
.macros{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:8px 0 10px}
.macros div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 6px;text-align:center}
.macros b{display:block;font-size:1.2rem;font-weight:800;font-stretch:72%;font-variant-numeric:tabular-nums}
.macros span{font-size:.72rem;color:var(--muted)}
.micro{display:grid;gap:5px}
.micro-row{display:grid;grid-template-columns:minmax(88px,1.2fr) auto minmax(40px,1fr) 44px;gap:8px;align-items:center;font-size:.82rem}
.micro-val{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.micro-bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.micro-bar i{display:block;height:100%;background:var(--ok)}
.micro-pct{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.micro-note{font-size:.76rem;color:var(--muted);margin:8px 0 0}

/* cartes : budget, besoins */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin:4px 0 8px}
.card-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.card-label{font-weight:700}
.card-val{font-size:1.9rem;font-weight:800;font-stretch:68%;font-variant-numeric:tabular-nums;white-space:nowrap}
.card-val small{font-size:.9rem;font-weight:600;font-stretch:90%;color:var(--muted)}
.card-status{margin:10px 0 4px;font-size:.88rem}
.card-warn{color:var(--tomato);font-weight:600}
.bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden;margin:10px 0 4px}
.bar i{display:block;height:100%;background:var(--ok)}
.bar i.over{background:var(--tomato)}
.lines{display:grid;gap:4px;margin:10px 0 4px}
.line{display:grid;grid-template-columns:1fr auto;gap:10px;font-size:.88rem;align-items:baseline}
.line b{font-variant-numeric:tabular-nums}
.seg{display:inline-flex;border:1px solid var(--ink);border-radius:999px;overflow:hidden}
.seg button{border:0;background:none;padding:7px 13px;font-weight:600;font-size:.86rem}
.seg button[aria-checked="true"]{background:var(--ink);color:var(--bg)}
.setting{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 0}

/* semaine */
.day{display:grid;grid-template-columns:1fr auto;gap:6px 12px;padding:12px 0;border-bottom:1px solid var(--line)}
.day-name{font-weight:700}
.day-slots{grid-column:1 / -1;display:grid;gap:6px}
.day-slot{display:grid;grid-template-columns:64px 1fr;gap:2px 8px;align-items:center;font-size:.88rem}
.day-slot > span{color:var(--muted);font-size:.78rem}
.day-slot small{grid-column:2;color:var(--muted);font-size:.76rem}
.day-cost{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.day-cost span{font-weight:400;font-size:.8rem;color:var(--muted);margin-left:6px}
.day .nut{grid-column:1 / -1;margin-top:0}
select,input[type=text],input[type=number],input[type=search],textarea{padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--surface);max-width:100%}
select{width:100%}

/* stock */
.item{display:grid;grid-template-columns:1fr auto auto;gap:4px 10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.item-name{font-weight:600}
.item-days{font-size:.8rem;color:var(--muted)}
.item-days.low{color:var(--tomato);font-weight:600}
.qty{display:flex;align-items:center;gap:6px}
.qty input{width:82px;text-align:right;font-variant-numeric:tabular-nums}
.pack{border:1px solid var(--ink);background:none;border-radius:999px;padding:6px 11px;font-weight:600;white-space:nowrap;font-size:.86rem}
.banner{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--yolk);border-radius:10px;padding:14px;margin-bottom:8px}
.banner p{margin:0 0 10px}

/* aliments, éditeurs */
.food summary{display:flex;justify-content:space-between;gap:10px;align-items:baseline;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer;font-weight:600}
.food summary span{font-weight:400;font-size:.82rem;color:var(--muted);text-align:right}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;padding:12px 0 16px}
.food .fields{border-bottom:1px solid var(--line)}
.field{display:grid;gap:3px;align-content:start;min-width:0}
.field label{font-size:.76rem;color:var(--muted)}
.field input,.field select,.field textarea{width:100%}
.wide{grid-column:1 / -1}
.check{display:flex;gap:6px;align-items:center;font-size:.88rem}
.sep{grid-column:1 / -1;font-size:.8rem;font-weight:700;color:var(--muted);margin-top:4px}
textarea{width:100%;min-height:110px}
textarea.mono{font-size:.8rem;font-family:ui-monospace,monospace}

/* courses */
.buy{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:11px 0;border-bottom:1px solid var(--line)}
.buy-name{font-weight:600}
.buy-detail{font-size:.82rem;color:var(--muted)}
.buy-warn{grid-column:1 / -1;font-size:.8rem;color:var(--tomato)}
.buy-price{font-weight:700;font-variant-numeric:tabular-nums;grid-row:span 2;align-self:center}
.total{display:flex;justify-content:space-between;align-items:baseline;margin-top:16px;padding-top:12px;border-top:2px solid var(--ink)}
.total b{font-size:1.8rem;font-weight:800;font-stretch:70%}
.note{font-size:.8rem;color:var(--muted);margin-top:12px}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);opacity:0;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:.9rem;transition:opacity .2s,transform .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion: reduce){.toast{transition:none}}
</style>
</head>
<body>
<header>
  <div class="head-inner">
    <h1>Suical</h1>
    <div class="sub" id="sub"></div>
    <nav role="tablist">
      <button role="tab" aria-selected="true" data-tab="recettes">Recettes</button>
      <button role="tab" aria-selected="false" data-tab="semaine">Semaine</button>
      <button role="tab" aria-selected="false" data-tab="courses">Courses</button>
      <button role="tab" aria-selected="false" data-tab="stock">Stock</button>
      <button role="tab" aria-selected="false" data-tab="aliments">Aliments</button>
      <button role="tab" aria-selected="false" data-tab="profil">Profil</button>
    </nav>
  </div>
</header>
<main>
  <section id="tab-recettes"></section>
  <section id="tab-semaine" hidden></section>
  <section id="tab-courses" hidden></section>
  <section id="tab-stock" hidden></section>
  <section id="tab-aliments" hidden></section>
  <section id="tab-profil" hidden></section>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

};
const MICRO_ORDER = ["fib","vc","va","ve","vk","b9","b12","ca","fe","mg","zn","k","io","se"];
const CATS = [{id:"frais",name:"Crèmerie et œufs"},{id:"viande",name:"Viande et poisson"},{id:"legumes",name:"Fruits et légumes"},{id:"epicerie",name:"Épicerie"}];

  tortillas:      {name:"Wraps de blé", unit:"pc", cat:"epicerie", pack:8, packLabel:"sachet de 8", price:1.60, gluten:true,

                   nut:nutObj([140,7.5,18,2.5,6, 0,2,0.4,4,60, 0,45,2,35,1.3,110, 1,2])},
  haricots_verts: {name:"Haricots verts en conserve", unit:"g", cat:"epicerie", pack:440, packLabel:"boîte (440 g égouttés)", price:1.10,
                   nut:nutObj([22,1.3,3,0.2,3, 4,30,0.1,15,30, 0,40,0.8,15,0.3,100, 0,0.2])},

const LS_KEY = "suical-recettes-v3";
/* Clé distincte de l'ancienne version (stock et sessions) : ses données restent intactes dans la base. */
const DB_NAME = "suical", STORE = "state", KEY = "recettes-v3";
const clone = o => JSON.parse(JSON.stringify(o));

function freshState(){
  const stock = {}; for (const k in DEFAULT_ITEMS) stock[k] = 0;
  return {v:3, items:clone(DEFAULT_ITEMS), dishes:clone(DEFAULT_DISHES), plan:[], days:5, stock, log:[],
          favs:[], hidden:[], known:DEFAULT_DISHES.map(d=>d.id),
          profile:{male:false, age:19, cm:169, kg:60, steps:7000, sessions:1.5, sessionMin:60, intensity:1}, kgSet:false,
          budget:200, pasta:"normal", maxGluten:4};
}
let state = freshState();

/* IndexedDB : un seul enregistrement, plus robuste que localStorage sur mobile */
function openDB(){
  return new Promise((resolve, reject)=>{
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = () => req.result.createObjectStore(STORE);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
function idbGet(){
  return openDB().then(db => new Promise((resolve, reject)=>{
    const req = db.transaction(STORE, "readonly").objectStore(STORE).get(KEY);
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => reject(req.error);
  }));
}
function idbSet(value){
  return openDB().then(db => new Promise((resolve, reject)=>{
    const tx = db.transaction(STORE, "readwrite");
    tx.objectStore(STORE).put(value, KEY);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  }));
}
function lsBackup(){
  try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch(e){ /* quota, on ignore */ }
}

async function load(){
  try {
    const stored = await idbGet();
    if (stored) { state = migrate(stored); return; }
  } catch(e){ /* IndexedDB indisponible : on retombe sur localStorage */ }
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) { state = migrate(JSON.parse(raw)); await saveNow(); }
  } catch(e){ /* premier lancement */ }
}
function migrate(d){
  const s = freshState();
  if (!d || d.v!==3) return s;
  if (d.items) s.items = Object.assign(clone(DEFAULT_ITEMS), d.items);
  for (const [k,it] of Object.entries(s.items)) if (!("fam" in it) && DEFAULT_ITEMS[k]) it.fam = DEFAULT_ITEMS[k].fam || "";
  if (Array.isArray(d.dishes) && d.dishes.length) {
    /* recettes ajoutées dans une mise à jour du site : proposées une fois, jamais remises si supprimées */
    const known = new Set(Array.isArray(d.known) ? d.known : d.dishes.map(x=>x.id));
    s.dishes = d.dishes.concat(clone(DEFAULT_DISHES).filter(x=>!known.has(x.id) && !d.dishes.some(y=>y.id===x.id)));
  }
  for (const x of s.dishes) if (x.group!=="repas" && !Array.isArray(x.moments)) {
    const def = DEFAULT_DISHES.find(y=>y.id===x.id);
    x.moments = def && def.moments ? def.moments.slice() : ["petitdej"];
  }
  if (Array.isArray(d.favs)) s.favs = d.favs.filter(id=>s.dishes.some(x=>x.id===id));
  if (Array.isArray(d.hidden)) s.hidden = d.hidden.filter(id=>s.dishes.some(x=>x.id===id));
  if ([5,6,7].includes(d.days)) s.days = d.days;
  if (Array.isArray(d.plan)) s.plan = d.plan.slice(0, s.days).map(p=>[0,1,2,3].map(j=>(Array.isArray(p) && p[j]) || ""));
  if (d.stock) { for (const k in s.items) s.stock[k] = Number(d.stock[k])>0 ? Number(d.stock[k]) : 0; }
  if (Array.isArray(d.log)) s.log = d.log.slice(0,40);
  if (d.profile) Object.assign(s.profile, d.profile);
  s.kgSet = !!d.kgSet;
  if (Number(d.budget)>0) s.budget = Number(d.budget);
  if (d.pasta==="sg") s.pasta = "sg";
  if (Number(d.maxGluten)>=0) s.maxGluten = Number(d.maxGluten);
  return s;
}
async function saveNow(){
  const snapshot = clone(state);
  try { await idbSet(snapshot); lsBackup(); }
  catch(e){ lsBackup(); toast("Sauvegarde en mémoire de secours"); }
}
let saveTimer = null;
function save(){ clearTimeout(saveTimer); saveTimer = setTimeout(saveNow, 250); }
window.addEventListener("pagehide", ()=>{ clearTimeout(saveTimer); lsBackup(); });

const items = () => state.items;
const dishes = () => state.dishes;
const dishById = id => state.dishes.find(d=>d.id===id) || null;
const isFav = d => state.favs.includes(d.id);
const isHidden = d => state.hidden.includes(d.id);
const fitsMoment = (d, m) => m==="repas" ? d.group==="repas" : d.group!=="repas" && (d.moments||["petitdej"]).includes(m);

/* ============================================================
   3. Calculs
   ============================================================ */
/* Ingrédients réellement utilisés : les pâtes deviennent sans gluten si c'est le réglage choisi. */
function effIng(d){
  const ing = Object.assign({}, d.ing);
  if (state.pasta==="sg" && ing.pates!==undefined && items().pates_sg) { ing.pates_sg = (ing.pates_sg||0) + ing.pates; delete ing.pates; }
  return ing;
}
function nutOf(ing){
  const t = {}; NUT_KEYS.forEach(k=>t[k]=0);
  for (const [id,q] of Object.entries(ing)) {
    const it = items()[id]; if (!it) continue;
    const f = (it.unit==="g"||it.unit==="ml") ? q/100 : q;
    NUT_KEYS.forEach(k=>{ t[k] += (Number(it.nut[k])||0)*f; });
  }
  return t;
}
/* Prix au prorata du paquet : ce que coûte vraiment la portion, le reste du paquet sert ailleurs. */
function costOf(ing){
  let c = 0;
  for (const [id,q] of Object.entries(ing)) {
    const it = items()[id]; if (!it || !it.pack) continue;
    c += q/it.pack*(Number(it.price)||0);
  }
  return c;
}
const dishCost = d => costOf(effIng(d));
const hasGluten = d => Object.keys(effIng(d)).some(k=>items()[k] && items()[k].gluten);
const isRed = d => Object.keys(effIng(d)).some(k=>items()[k] && items()[k].red);
/* Jours de conservation de l'ingrédient le plus périssable (99 = rien de fragile). */
const shelf = d => Math.min(99, ...Object.keys(effIng(d)).map(k=>(items()[k] && items()[k].fresh) || 99));
/* Source de protéines principale (viande ou œufs), pour varier la semaine. */
function mainProt(d){
  let best = "", max = 0;
  for (const [k,q] of Object.entries(effIng(d))) {
    const it = items()[k]; if (!it || (it.cat!=="viande" && k!=="oeufs")) continue;
    const p = (Number(it.nut.p)||0)*((it.unit==="g"||it.unit==="ml") ? q/100 : q);
    if (p > max) { max = p; best = k; }
  }
  return best;
}
/* Féculents présents (toute quantité) ou sources de protéines qui apportent au moins 5 g à la portion. */
function famsOf(d, kind){
  const out = new Set();
  for (const [k,q] of Object.entries(effIng(d))) {
    const it = items()[k]; if (!it || !it.fam || !FAMS[kind].includes(it.fam) || !(q>0)) continue;
    if (kind==="proteine" && (Number(it.nut.p)||0)*((it.unit==="g"||it.unit==="ml") ? q/100 : q) < 5) continue;
    out.add(it.fam);
  }
  return out;
}
const MEAT = ["Poulet","Porc","Bœuf","Saumon"];
function tagsOf(d){
  const t = new Set(d.tags||[]);
  if (!hasGluten(d)) t.add("sansgluten");
  if (d.time && d.time<=15) t.add("rapide");
  if (isRed(d)) t.add("rouge");
  if (d.group!=="repas") for (const m of d.moments||["petitdej"]) t.add(m);
  return t;
}

function slotIng(ids){
  const ing = {};
  for (const id of ids) { const d = dishById(id); if (!d) continue;
    for (const [k,q] of Object.entries(effIng(d))) ing[k]=(ing[k]||0)+q; }
  return ing;
}
const dayIng = i => slotIng(state.plan[i]||[]);
const weekIng = () => slotIng(state.plan.flat());
const DAILY = {};
function recomputeDaily(){
  for (const k in DAILY) delete DAILY[k];
  for (const [k,q] of Object.entries(weekIng())) DAILY[k] = q/7;
}
function possible(d){
  let n = Infinity;
  const ing = effIng(d);
  if (!Object.keys(ing).length) return 0;
  for (const [k,q] of Object.entries(ing)) if (q>0) n = Math.min(n, Math.floor((state.stock[k]||0)/q));
  return n===Infinity ? 0 : n;
}
const daysLeft = k => DAILY[k] ? (state.stock[k]||0)/DAILY[k] : Infinity;

/* Dépense estimée : Mifflin-St Jeor, comme l'app Android. */
function maintenance(){
  const p = state.profile, kg = Number(p.kg)||60;
  const bmr = 10*kg + 6.25*(Number(p.cm)||165) - 5*(Number(p.age)||20) + (p.male ? 5 : -161);
  const stride = (Number(p.cm)||165)/100*(p.male ? 0.415 : 0.413);
  const steps = Math.max(0, (Number(p.steps)||0) - 3000) * 0.5*kg*stride/1000;
  const training = (MET[p.intensity] - 1)*kg*(Number(p.sessionMin)||0)/60*(Number(p.sessions)||0)/7;
  return {bmr, daily:bmr*0.2, steps, training, total:bmr*1.2 + steps + training};
}
function weekCost(){ return costOf(weekIng()); }
const monthOf = w => w*52/12;

/* ============================================================
   4. Semaine proposée automatiquement
   ============================================================ */
function shuffle(a){ for (let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; }
/* Le soir on cuisine 2 portions : la 2e fait le midi du lendemain. Les favoris d'abord, puis les moins chers,
   au plus une viande rouge, deux soirs au plus avec la même viande, les repas avec gluten plafonnés,
   et la viande fraîche en début de semaine (pas de congélateur). Les recettes retirées ne sortent jamais. */
function autoPlan(){
  const n = state.days;
  const meals = dishes().filter(d=>d.group==="repas" && Object.keys(d.ing).length && !isHidden(d)
    && (isFav(d) || !(d.tags||[]).some(t=>t==="plaisir"||t==="tester")));
  const byCost = meals.slice().sort((a,b)=>dishCost(a)-dishCost(b));
  const cheap = byCost.filter(d=>!isFav(d));
  const pool = [...shuffle(byCost.filter(isFav)), ...shuffle(cheap.slice(0, Math.max(10, Math.ceil(cheap.length*0.6))))];
  let gluten = 0, red = 0;
  const dinners = [];
  const fits = (d, portions) => (!hasGluten(d) || gluten+portions <= state.maxGluten) && (!isRed(d) || red<1)
    && (!mainProt(d) || dinners.filter(x=>mainProt(x)===mainProt(d)).length < 2);
  const add = d => { dinners.push(d); if (hasGluten(d)) gluten += 2; if (isRed(d)) red++; };
  /* au moins un soir de poulet, parmi les recettes de poulet les moins chères */
  const chicken = shuffle(byCost.filter(d=>["poulet","pilons"].includes(mainProt(d))).slice(0,4)).find(d=>fits(d,2));
  if (chicken) {
    add(chicken);
    /* sans congélateur, la barquette entamée doit être finie : un 2e soir avec la même viande si elle le permet */
    const left = freshLeft(dinners.map(d=>[d,2]));
    const again = shuffle(byCost.filter(d=>d!==chicken && mainProt(d)===mainProt(chicken)).slice(0,4))
      .find(d=>fits(d,2) && coveredBy(d, left, 2));
    if (again && n>1) add(again);
  }
  for (let i=dinners.length;i<n;i++) {
    /* un paquet frais peut être ouvert s'il n'en reste pas une portion entière à jeter */
    const noWaste = d => { const left = freshLeft([...dinners.map(x=>[x,2]), [d,2]]);
      return Object.entries(effIng(d)).every(([k,q])=>!(items()[k] && items()[k].fresh) || (left[k]||0) < q); };
    const pick = pool.find(d=>!dinners.includes(d) && fits(d,2) && noWaste(d))
      || pool.find(d=>!dinners.includes(d) && fits(d,2))
      || shuffle(byCost.slice()).find(d=>!dinners.includes(d) && fits(d,2))
      || byCost.find(d=>!hasGluten(d) && !isRed(d)) || byCost[0];
    if (!pick) break;
    add(pick);
  }
  dinners.sort((a,b)=>shelf(a)-shelf(b));
  /* lundi midi : de préférence de quoi finir une barquette entamée, sinon un plat à emporter sans viande fraîche en plus */
  const left = freshLeft(dinners.map((d,i)=>[d, i<n-1 ? 2 : 1]));
  const lunchOk = d => !dinners.includes(d) && (!hasGluten(d) || gluten+1 <= state.maxGluten) && coveredBy(d, left, 1);
  const lunch0 = byCost.find(d=>lunchOk(d) && Object.keys(effIng(d)).some(k=>left[k]>0))
    || shuffle(byCost.filter(d=>lunchOk(d) && (d.tags||[]).includes("emporter")).slice(0,5))[0]
    || byCost.find(lunchOk) || byCost.find(d=>!dinners.includes(d)) || dinners[0];
  /* petit-déj et goûter : favoris, puis ceux qui n'ajoutent pas de produit à acheter (wraps du sachet entamé…), puis le prix */
  const inWeek = new Set([lunch0, ...dinners].filter(Boolean).flatMap(d=>Object.keys(effIng(d))));
  const sides = (m, extraUsed, exclude=[]) => {
    const extra = d => Object.keys(effIng(d)).filter(k=>!inWeek.has(k) && !extraUsed.has(k)).length;
    const list = dishes().filter(d=>fitsMoment(d,m) && !isHidden(d) && !exclude.includes(d) && Object.keys(d.ing).length)
      .sort((a,b)=>(isFav(b)-isFav(a)) || (extra(a)-extra(b)) || (dishCost(a)-dishCost(b)));
    const picked = shuffle(list.slice(0,3));
    picked.forEach(d=>Object.keys(effIng(d)).forEach(k=>extraUsed.add(k)));
    return picked;
  };
  const used = new Set();
  const bf = sides("petitdej", used);
  const gt = sides("gouter", used, bf);
  return Array.from({length:n}, (_,i)=>[
    bf.length ? bf[i%bf.length].id : "",
    i===0 ? (lunch0 ? lunch0.id : "") : (dinners[i-1] ? dinners[i-1].id : ""),
    dinners[i] ? dinners[i].id : "",
    gt.length ? gt[(i+1)%gt.length].id : ""]);
}
/* Ce qui reste des paquets d'ingrédients frais une fois ces portions cuisinées : [[plat, portions], …] */
function freshLeft(list){
  const used = {};
  for (const [d,n] of list) for (const [k,q] of Object.entries(effIng(d)))
    if (items()[k] && items()[k].fresh) used[k] = (used[k]||0) + q*n;
  const left = {};
  for (const [k,u] of Object.entries(used)) { const p = items()[k].pack || 1; left[k] = Math.ceil(u/p - 1e-9)*p - u; }
  return left;
}
/* Le plat n'oblige à ouvrir aucun nouveau paquet frais. */
const coveredBy = (d, left, n) => Object.entries(effIng(d)).every(([k,q])=>!(items()[k] && items()[k].fresh) || (left[k]||0) >= q*n);

function resizePlan(){
  while (state.plan.length < state.days) state.plan.push(["","","",""]);
  for (const day of state.plan) while (day.length < 4) day.push("");
  state.plan.length = state.days;
}

   5. Formatage et helpers DOM
   ============================================================ */
const nf = (v,d=0) => (Number(v)||0).toLocaleString("fr-FR",{maximumFractionDigits:d});
const eur = v => (Number(v)||0).toLocaleString("fr-FR",{style:"currency",currency:"EUR"});
const eur0 = v => (Number(v)||0).toLocaleString("fr-FR",{style:"currency",currency:"EUR",maximumFractionDigits:0});
function unitLabel(u){ return u==="pc" ? "pièces" : u; }
function fmtQty(id, v){
  const it = items()[id]; if (!it) return nf(v);
  if (it.unit==="g") return v>=1000 ? nf(v/1000,2)+" kg" : nf(v)+" g";
  if (it.unit==="ml") return v>=1000 ? nf(v/1000,2)+" L" : nf(v)+" ml";
  if (it.unit==="pc") return nf(v,1)+(v>1?" pièces":" pièce");
  return nf(v)+" "+it.unit;
}
function el(tag, attrs={}, ...kids){
  const n = document.createElement(tag);
  for (const [a,v] of Object.entries(attrs)) {
    if (a==="class") n.className = v;
    else if (a.startsWith("on")) n.addEventListener(a.slice(2), v);
    else if (v!==false && v!=null) n.setAttribute(a, v===true?"":v);
  }
  for (const k of kids) if (k!=null) n.append(k);
  return n;
}
function field(label, input, cls){ return el("div",{class:"field"+(cls?" "+cls:"")}, el("label",{}, label), input); }
function numInput(value, onChange, opts={}){
  const i = el("input",{type:"number", inputmode:"decimal", step:opts.step||"any", min:opts.min||"0", value:String(value)});
  i.addEventListener("change", e=>{ const v = Number(String(e.target.value).replace(",","."))||0; typed(()=>onChange(v)); });
  return i;
}
function textInput(value, onChange, attrs={}){
  const i = el("input", Object.assign({type:"text", value}, attrs));
  i.addEventListener("change", e=>{ const v = e.target.value.trim(); typed(()=>onChange(v)); });
  return i;
}
/* Saisie au clavier : si elle enchaîne sur un autre champ, on ne redessine pas la page sous ses doigts.
   Le rendu attend qu'elle quitte les champs de saisie. */
let soft = false, pendingRender = false;
const typing = () => { const a = document.activeElement;
  return !!a && (a.tagName==="TEXTAREA" || (a.tagName==="INPUT" && !["checkbox","radio","button"].includes(a.type))); };
function typed(fn){ setTimeout(()=>{ soft = true; try { fn(); } finally { soft = false; } }); }
document.addEventListener("focusout", ()=>setTimeout(()=>{ if (pendingRender && !typing()) render(); }));
function selectInput(options, value, onChange){
  const s = el("select",{}, ...options.map(([v,l])=>el("option",{value:String(v), selected:String(value)===String(v)}, l)));
  s.addEventListener("change", e=>onChange(e.target.value));
  return s;
}
let toastT;
function toast(msg){
  const t = document.getElementById("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastT); toastT = setTimeout(()=>t.classList.remove("show"), 2400);
}
const slug = s => s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"_").replace(/^_|_$/g,"") || "x";
function newId(prefix, exists){ let base = slug(prefix), id = base, i = 2; while (exists(id)) id = base+"_"+(i++); return id; }
const itemName = k => items()[k] ? items()[k].name : k;
function showTab(id){
  document.querySelectorAll("nav button").forEach(x=>x.setAttribute("aria-selected", x.dataset.tab===id?"true":"false"));
  for (const t of ["recettes","semaine","courses","stock","aliments","profil"]) document.getElementById("tab-"+t).hidden = t!==id;
  window.scrollTo({top:0});
}

/* ============================================================
   6. Actions
   ============================================================ */
function cooked(d, n){
  const used = {};
  for (const [k,q] of Object.entries(effIng(d))) { used[k] = q*n; state.stock[k] = Math.max(0,(state.stock[k]||0)-q*n); }
  state.log.unshift({dish:d.id, t:Date.now(), n, ing:used});
  state.log = state.log.slice(0,40);
  save(); render(); toast(d.name+" ×"+n+" : retiré du stock");
}
function undo(i){
  const e = state.log[i];
  for (const [k,q] of Object.entries(e.ing||{})) state.stock[k] = (state.stock[k]||0)+q;
  state.log.splice(i,1);
  save(); render(); toast("Annulé, stock remis");
}
function toggleFav(d){
  state.favs = isFav(d) ? state.favs.filter(x=>x!==d.id) : [...state.favs, d.id];
  save(); render(); toast(isFav(d) ? "Ajoutée aux favoris : proposée en priorité" : "Retirée des favoris");
}
/* « Pas pour moi » : la recette disparaît de la liste, du planning et des propositions, mais reste restaurable. */
function hideDish(d){
  const inPlan = state.plan.some(day=>day.includes(d.id));
  if (!confirm("Retirer « "+d.name+" » ?\n\nElle ne sera plus affichée ni proposée"+(inPlan ? ", et sera enlevée du planning" : "")
    +". Tu pourras la remettre en bas de la liste des recettes.")) return;
  state.hidden.push(d.id); state.favs = state.favs.filter(x=>x!==d.id);
  state.plan = state.plan.map(day=>day.map(id=>id===d.id ? "" : id));
  if (state.editDish===d.id) state.editDish = null;
  save(); render(); toast(inPlan ? "Retirée, et enlevée du planning" : "Retirée, elle ne sera plus proposée");
}
function unhideDish(d){ state.hidden = state.hidden.filter(x=>x!==d.id); save(); render(); toast(d.name+" est de retour"); }
let cover = 7;
function buyList(){
  const rows = [];
  const week = weekIng();
  for (const k in items()) {
    const total = (week[k]||0)*cover/7;
    const need = total - (state.stock[k]||0);
    if (need <= 0) continue;
    const it = items()[k], pack = it.pack || 1;
    const packs = Math.ceil(need/pack - 1e-9);
    rows.push({k, packs, cost:packs*(it.price||0), left:packs*pack - need});
  }
  return rows;
}

function macroLine(t){
  return el("div",{class:"macros"},
    ...[["kcal","kcal"],["p","prot."],["g","gluc."],["l","lip."]].map(([k,lab])=>
      el("div",{}, el("b",{}, nf(t[k])+(k==="kcal"?"":" g")), el("span",{}, lab))));
}
function nutRef(k){
  const info = NUT_INFO[k]; const p = state.profile;
  if (k==="ca" && p.age<25) return 1000;
  return p.male ? info[2] : info[3];
}
function nutPanel(t, label, withMacros=true){
  const grid = el("div",{class:"micro"});
  for (const k of MICRO_ORDER) {
    const [name,unit] = NUT_INFO[k]; const ref = nutRef(k);
    const pct = ref ? Math.round(t[k]/ref*100) : 0;
    grid.append(el("div",{class:"micro-row"},
      el("span",{}, name),
      el("span",{class:"micro-val"}, nf(t[k], t[k]<10?1:0)+" "+unit),
      el("span",{class:"micro-bar","aria-hidden":"true"}, el("i",{style:"width:"+Math.min(pct,100)+"%"})),
      el("span",{class:"micro-pct"}, pct+" %")));
  }
  return el("details",{class:"nut"}, el("summary",{}, label),
    withMacros ? macroLine(t) : null, grid,
    el("p",{class:"micro-note"},"Pourcentages des références ANSES par jour pour "+(state.profile.male?"un homme":"une femme")+" adulte. Poids crus."));
}

/* ============================================================
   8. Onglet Recettes
   ============================================================ */
let filter = "tout", sortBy = "prix", fecFilter = "", protFilter = "";
const FILTERS = [["tout","Toutes"],["favoris","★ Favoris"],["petitdej","Petit-déj"],["gouter","Goûter"],["pascher","Pas chères"],
  ["airfryer","Air fryer"],["emporter","À emporter"],["sansgluten","Sans gluten"],["rapide","Rapides"],["plaisir","Plaisir"],["tester","À tester"]];
const SORTS = [["prix","Moins chères d'abord"],["prot","Plus de protéines"],["kcal","Moins caloriques"],["temps","Plus rapides"]];

function matchesFam(d){
  if (fecFilter) { const f = famsOf(d,"feculent");
    if (fecFilter==="-" ? f.size : !f.has(fecFilter)) return false; }
  if (protFilter) { const f = famsOf(d,"proteine");
    if (protFilter==="-" ? MEAT.some(m=>f.has(m)) : !f.has(protFilter)) return false; }
  return true;
}
function matches(d){
  if (isHidden(d) || !matchesFam(d)) return false;
  if (filter==="tout") return true;
  if (filter==="favoris") return isFav(d);
  if (filter==="pascher") return dishCost(d) <= CHEAP;
  return tagsOf(d).has(filter);
}
function sorter(a,b){
  /* la recette en cours d'édition reste en tête, sinon elle saute dans la liste à chaque changement de prix */
  if ((a.id===state.editDish) !== (b.id===state.editDish)) return a.id===state.editDish ? -1 : 1;
  if (isFav(a)!==isFav(b)) return isFav(b)-isFav(a);
  if (sortBy==="prot") return nutOf(effIng(b)).p - nutOf(effIng(a)).p;
  if (sortBy==="kcal") return nutOf(effIng(a)).kcal - nutOf(effIng(b)).kcal;
  if (sortBy==="temps") return (a.time||99) - (b.time||99);
  return dishCost(a) - dishCost(b);
}
/* Menu d'une famille : seulement celles présentes dans les recettes visibles, avec leur nombre. */
function famSelect(kind, value, none, onChange){
  const visible = dishes().filter(d=>!isHidden(d));
  const opts = [["", kind==="feculent" ? "Tous les féculents" : "Toutes les protéines"]];
  for (const f of FAMS[kind]) { const n = visible.filter(d=>famsOf(d,kind).has(f)).length; if (n) opts.push([f, f+" ("+n+")"]); }
  opts.push(["-", none]);
  const s = selectInput(opts, value, onChange);
  s.setAttribute("aria-label", kind==="feculent" ? "Filtrer par féculent" : "Filtrer par protéine");
  return s;
}

function newDish(){
  const id = newId("recette", x=>dishById(x));
  state.dishes.push({id, name:"Nouvelle recette", group:"repas", time:20, tags:[], ing:{}, steps:[]});
  openEditor(id);
}
function duplicateDish(d){
  const id = newId(d.id+"_copie", x=>dishById(x));
  const copy = Object.assign(clone(d), {id, name:d.name+" (copie)"});
  state.dishes.splice(state.dishes.indexOf(d)+1, 0, copy);
  openEditor(id); toast("Copie créée, modifie-la à ton goût");
}
function deleteDish(d){
  if (!confirm("Supprimer définitivement « "+d.name+" » ?")) return;
  state.dishes = state.dishes.filter(x=>x.id!==d.id);
  state.plan = state.plan.map(day=>day.map(id=>id===d.id ? "" : id));
  state.favs = state.favs.filter(x=>x!==d.id); state.hidden = state.hidden.filter(x=>x!==d.id);
  state.editDish = null;
  save(); render(); toast("Recette supprimée");
}
/* Ouvre l'éditeur d'une recette, en levant les filtres qui pourraient la cacher. */
function openEditor(id){
  state.editDish = id; filter = "tout"; fecFilter = ""; protFilter = "";
  save(); showTab("recettes"); render();
  const card = document.getElementById("dish-"+id);
  if (card) { card.scrollIntoView({block:"start"}); const name = card.querySelector(".fields input[type=text]");
    if (name && dishById(id).name.startsWith("Nouvelle")) { name.focus({preventScroll:true}); name.select(); } }
}

function renderRecettes(){
  const root = document.getElementById("tab-recettes"); root.replaceChildren();
  if (!state.kgSet) root.append(el("div",{class:"banner"},
    el("p",{},"Indique ton poids dans Profil : chaque plat affiche alors la part de ta journée qu'il représente."),
    el("button",{class:"primary", onclick:()=>showTab("profil")},"Ouvrir le profil")));

  root.append(el("div",{class:"chips", role:"group", "aria-label":"Filtrer les recettes"},
    ...FILTERS.map(([v,l])=>el("button",{class:"chip", "aria-pressed":String(filter===v), onclick:()=>{ filter=v; renderRecettes(); }}, l))));
  root.append(el("div",{class:"filters"},
    famSelect("feculent", fecFilter, "Sans féculent", v=>{ fecFilter = v; renderRecettes(); }),
    famSelect("proteine", protFilter, "Sans viande ni poisson", v=>{ protFilter = v; renderRecettes(); })));
  const sort = selectInput(SORTS, sortBy, v=>{ sortBy=v; renderRecettes(); });
  sort.setAttribute("aria-label","Trier les recettes");
  root.append(el("div",{class:"controls"}, el("span",{},"Trier"), sort,
    el("button",{class:"ghost", style:"margin-left:auto", onclick:newDish},"+ Nouvelle recette")));

  const maint = maintenance().total;
  for (const [g,title] of [["repas","Repas"],["petitdej","Petit-déj et goûter"]]) {
    const list = dishes().filter(d=>(g==="repas") === (d.group==="repas") && (matches(d) || d.id===state.editDish && !isHidden(d))).sort(sorter);
    if (!list.length) continue;
    root.append(el("h2",{}, title+" · "+list.length));
    for (const d of list) root.append(recipeCard(d, maint));
  }
  if (!dishes().some(matches)) root.append(el("p",{class:"empty"}, filter==="favoris" && !fecFilter && !protFilter
    ? "Pas encore de favori : appuie sur ☆ sous une recette que tu aimes." : "Aucune recette avec ces filtres."));
  if (fecFilter || protFilter) root.append(el("button",{class:"link", onclick:()=>{ fecFilter = protFilter = ""; renderRecettes(); }},"Enlever les filtres féculent et protéine"));

  root.append(el("h2",{},"Ajouter une recette"));
  root.append(el("p",{class:"intro"},"Crée la tienne de zéro, ou appuie sur « Modifier » puis « Dupliquer » sous une recette proche pour partir de celle-là."));
  root.append(el("div",{class:"row-btns"}, el("button",{class:"primary", onclick:newDish},"Nouvelle recette")));

  const hidden = dishes().filter(isHidden);
  if (hidden.length) {
    root.append(el("h2",{},"Pas pour moi · "+hidden.length));
    root.append(el("p",{class:"intro"},"Ces recettes ne sont plus affichées ni proposées dans la semaine."));
    for (const d of hidden) root.append(el("div",{class:"log-row"}, el("div",{}, d.name),
      el("button",{class:"link", onclick:()=>unhideDish(d)},"Remettre")));
  }

  if (state.log.length) {
    root.append(el("h2",{},"Derniers plats cuisinés"));
    state.log.slice(0,10).forEach((e,i)=>{
      const d = dishById(e.dish); if (!d) return;
      const dt = new Date(e.t);
      const when = dt.toLocaleDateString("fr-FR",{weekday:"short",day:"numeric",month:"short"});
      root.append(el("div",{class:"log-row"},
        el("div",{}, d.name+" ×"+(e.n||1), el("time",{datetime:dt.toISOString()}, when)),
        el("button",{class:"link", onclick:()=>undo(i)},"Annuler")));
    });
  }
}

function recipeCard(d, maint){
  const ing = effIng(d), t = nutOf(ing), cost = costOf(ing), tags = tagsOf(d);
  const meta = [nf(t.kcal)+" kcal", nf(t.p)+" g de prot."];
  if (d.time) meta.push(d.time+" min");
  if (state.kgSet && maint>0) meta.push("~"+Math.round(t.kcal/maint*100)+" % de ta journée");
  const tagEls = ["petitdej","gouter","airfryer","emporter","sansgluten","rapide","plaisir","tester","rouge"].filter(x=>tags.has(x))
    .map(x=>el("span",{class:"tag"+(x==="plaisir"||x==="tester"||x==="rouge"?" warn":"")}, TAGS[x]));
  const n = possible(d);

  const ingList = el("ul",{class:"ing-list"}, ...Object.entries(ing).map(([k,q])=>{
    const it = items()[k];
    return el("li",{}, el("span",{}, fmtQty(k,q)+" · "+itemName(k).toLowerCase()),
      el("span",{}, it && it.pack ? eur(q/it.pack*(it.price||0)) : "?"));
  }));
  const steps = (d.steps||[]).length ? el("ol",{class:"steps"}, ...d.steps.map(s=>el("li",{}, s))) : null;
  const editing = state.editDish===d.id;

  const card = el("article",{class:"rec", id:"dish-"+d.id},
    el("div",{class:"rec-top"},
      el("div",{}, el("div",{class:"rec-name"}, isFav(d) ? el("span",{class:"star","aria-label":"Favori"},"★ ") : null, d.name),
        el("div",{class:"rec-meta"}, meta.join(" · "))),
      el("div",{class:"price", "aria-label":eur(cost)+" la portion"}, el("b",{}, eur(cost)), el("span",{},"la portion"))),
    tagEls.length ? el("div",{class:"tags"}, ...tagEls) : null,
    editing ? null : el("details",{class:"nut", "data-key":"ing-"+d.id}, el("summary",{},"Ingrédients et étapes"),
      Object.keys(ing).length ? ingList : el("p",{class:"empty"},"Pas encore d'ingrédient."), steps,
      el("p",{class:"micro-note"},"Prix au prorata des paquets. Pour le lendemain midi, double tout.")),
    editing ? null : nutPanel(t, "Valeurs nutritionnelles"),
    el("div",{class:"row-btns"},
      editing ? null : el("button",{class:"cook", onclick:()=>cooked(d,1)},"Cuisiné ×1"),
      editing ? null : el("button",{class:"cook", onclick:()=>cooked(d,2)},"×2"),
      el("button",{class:"fav", "aria-pressed":String(isFav(d)), "aria-label":isFav(d)?"Retirer des favoris":"Ajouter aux favoris",
        onclick:()=>toggleFav(d)}, isFav(d) ? "★" : "☆"),
      el("button",{class:editing ? "primary" : "ghost", onclick:()=>{ state.editDish = editing ? null : d.id; save(); render(); }},
        editing ? "Terminé" : "Modifier"),
      editing ? null : el("button",{class:"link", onclick:()=>hideDish(d)},"Pas pour moi"),
      !editing && n>0 ? el("span",{class:"hint"},"Ton stock permet "+n+(n>1?" portions":" portion")) : null));
  if (editing) card.append(dishEditor(d));
  return card;
}

function dishEditor(d){
  const box = el("div",{class:"fields editor"});
  box.append(field("Nom", textInput(d.name, v=>{ if (v) d.name = v; save(); render(); })));
  box.append(field("Catégorie", selectInput([["repas","Repas"],["petitdej","Petit-déj ou goûter"]], d.group==="repas"?"repas":"petitdej",
    v=>{ d.group = v; if (v!=="repas" && !d.moments) d.moments = ["petitdej","gouter"]; save(); render(); })));
  box.append(field("Temps (min)", numInput(d.time||0, v=>{ d.time = v; save(); render(); }, {step:"1"})));

  const tagBox = el("div",{class:"wide", style:"display:flex;gap:14px;flex-wrap:wrap"});
  if (d.group!=="repas") for (const m of ["petitdej","gouter"]) {
    const c = el("input",{type:"checkbox", checked:(d.moments||[]).includes(m)});
    c.addEventListener("change", e=>{
      d.moments = (d.moments||[]).filter(x=>x!==m); if (e.target.checked) d.moments.push(m); save(); render(); });
    tagBox.append(el("label",{class:"check"}, c, TAGS[m]));
  }
  for (const t of ["airfryer","emporter","plaisir","tester"]) {
    const c = el("input",{type:"checkbox", checked:(d.tags||[]).includes(t)});
    c.addEventListener("change", e=>{
      d.tags = (d.tags||[]).filter(x=>x!==t); if (e.target.checked) d.tags.push(t); save(); render(); });
    tagBox.append(el("label",{class:"check"}, c, TAGS[t]));
  }
  box.append(tagBox);

  box.append(el("div",{class:"sep"},"Ingrédients pour une portion"));
  const rows = el("div",{class:"wide ing-edit"});
  for (const [k,q] of Object.entries(d.ing)) {
    const it = items()[k];
    const qty = numInput(q, v=>{ if (v>0) d.ing[k]=v; else delete d.ing[k]; save(); render(); });
    qty.setAttribute("aria-label", "Quantité de "+itemName(k));
    rows.append(el("div",{class:"ing-row"},
      el("span",{class:"ing-name"}, itemName(k)),
      el("span",{class:"qty"}, qty, el("small",{}, it ? (it.unit==="pc" ? "pc" : it.unit) : "?")),
      el("span",{class:"ing-cost"}, it && it.pack ? eur(q/it.pack*(it.price||0)) : "?"),
      el("button",{class:"remove", "aria-label":"Retirer "+itemName(k), onclick:()=>{ delete d.ing[k]; save(); render(); }},"×")));
  }
  if (!Object.keys(d.ing).length) rows.append(el("p",{class:"empty"},"Ajoute un premier ingrédient ci-dessous."));
  box.append(rows);
  const add = el("select",{}, el("option",{value:""},"Ajouter un ingrédient…"),
    ...Object.entries(items()).filter(([k])=>d.ing[k]===undefined).sort((a,b)=>a[1].name.localeCompare(b[1].name,"fr"))
      .map(([k,it])=>el("option",{value:k}, it.name)),
    el("option",{value:"+"},"+ Créer un nouvel aliment…"));
  add.addEventListener("change", e=>{
    let k = e.target.value; if (!k) return;
    if (k==="+") {
      const name = (prompt("Nom du nouvel aliment ?")||"").trim();
      if (!name) { e.target.value = ""; return; }
      k = createItem(name);
      toast("« "+name+" » créé : mets son prix et ses valeurs dans Aliments");
    }
    d.ing[k] = items()[k].unit==="pc" ? 1 : 100; save(); render();
  });
  box.append(field("Ajouter", add, "wide"));

  const steps = el("textarea",{"aria-label":"Étapes"}); steps.value = (d.steps||[]).join("\n");
  steps.addEventListener("change", e=>{ const v = e.target.value; setTimeout(()=>{ d.steps = v.split("\n").map(s=>s.trim()).filter(Boolean); save(); render(); }); });
  box.append(field("Étapes, une par ligne", steps, "wide"));

  box.append(el("div",{class:"row-btns wide"},
    el("button",{class:"ghost", onclick:()=>duplicateDish(d)},"Dupliquer"),
    el("button",{class:"danger", onclick:()=>deleteDish(d)},"Supprimer")));
  return box;
}

function budgetCard(){
  const w = weekCost(), m = monthOf(w), left = state.budget - m;
  const meals = state.plan.flat().filter(id=>dishById(id)).length;
  const pct = state.budget ? Math.min(100, m/state.budget*100) : 100;
  return el("div",{class:"card"},
    el("div",{class:"card-top"}, el("span",{class:"card-label"},"Budget nourriture"),
      el("span",{class:"card-val"}, eur0(m), el("small",{}," / mois"))),
    el("div",{class:"bar", role:"img", "aria-label":Math.round(pct)+" % du budget"}, el("i",{class:left<0?"over":"", style:"width:"+pct+"%"})),
    el("p",{class:"card-status"+(left<0?" card-warn":"")}, left>=0
      ? "Il reste ~"+eur0(left)+" sur "+eur0(state.budget)+", pour autre chose ou pour l'épargne."
      : "Dépasse le budget de "+eur0(-left)+" : remplace un plat par un moins cher."),
    el("div",{class:"lines"},
      el("div",{class:"line"}, el("span",{},"Semaine planifiée"), el("b",{}, eur(w))),
      el("div",{class:"line"}, el("span",{},"Prix moyen d'un repas ou petit-déj"), el("b",{}, eur(meals ? w/meals : 0)))),
    el("p",{class:"micro-note"},"Calculé au prorata de ce que tu manges. Les premières courses coûtent plus (huile, riz, épices, paquets entiers), puis ça se lisse."));
}

  root.append(el("div",{class:"row-btns"},
    el("button",{class:"primary", onclick:()=>{ state.plan = autoPlan(); save(); render(); toast("Nouvelle semaine proposée"); }},"Proposer une autre semaine")));
  root.append(el("p",{class:"intro"},"Les plats les moins chers d'abord, au moins un soir de poulet, la viande fraîche en début de semaine (pas de congélateur), au plus une viande rouge, "
    +state.maxGluten+" repas avec gluten maximum. Le plat du soir se cuisine en 2 portions : la 2e fait le midi du lendemain."));

  root.append(el("h2",{},"Planning"));
  /* favoris en tête, recettes retirées absentes (sauf celle déjà choisie) */
  const optsFor = (m, cur) => dishes().filter(d=>fitsMoment(d,m) && (!isHidden(d) || d.id===cur))
    .sort((a,b)=>(isFav(b)-isFav(a)) || a.name.localeCompare(b.name,"fr"));
  state.plan.forEach((day,i)=>{
    const ing = dayIng(i), t = nutOf(ing);
    const slots = el("div",{class:"day-slots"});
    SLOTS.forEach(([lab,j,m])=>{
      const sel = el("select",{"aria-label":DAYS[i]+" "+lab},
        el("option",{value:"", selected:!day[j]},"—"),
        ...optsFor(m, day[j]).map(d=>el("option",{value:d.id, selected:day[j]===d.id}, (isFav(d)?"★ ":"")+d.name+" · "+eur(dishCost(d)))));
      sel.addEventListener("change", e=>{ state.plan[i][j] = e.target.value; save(); render(); });
      let hint = null;
      if (j===1 && i>0 && day[1] && day[1]===state.plan[i-1][2]) hint = "Reste d'hier soir";
      else if (j===2 && day[2] && state.plan[i+1] && state.plan[i+1][1]===day[2]) hint = "Cuisine 2 portions, la 2e pour demain midi";
      slots.append(el("div",{class:"day-slot"}, el("span",{},lab), sel, hint ? el("small",{}, hint) : null));
    });
    root.append(el("div",{class:"day"},
      el("div",{class:"day-name"}, DAYS[i]),
      el("div",{class:"day-cost"}, eur(costOf(ing)), el("span",{}, nf(t.kcal)+" kcal")),
      slots,
      nutPanel(t, "Détail du jour")));
  });

  root.append(el("h2",{},"Moyenne par jour prévu"));
  const n = state.plan.length || 1;
  const avg = {}; for (const [k,q] of Object.entries(weekIng())) avg[k] = q/n;
  const ta = nutOf(avg);
  root.append(el("div",{}, macroLine(ta), nutPanel(ta, "Détail des micronutriments", false)));
  root.append(el("p",{class:"note"},"Sans les grignotages et boissons. Tes besoins estimés : ~"+nf(Math.round(maintenance().total/50)*50)+" kcal par jour."));
}

/* ============================================================
   10. Onglet Courses
   ============================================================ */
function renderCourses(){
  const root = document.getElementById("tab-courses"); root.replaceChildren();
  const sel = selectInput([[7,"1 semaine"],[14,"2 semaines"]], cover, v=>{ cover = Number(v); renderCourses(); });
  sel.setAttribute("aria-label","Durée à couvrir");
  root.append(el("div",{class:"controls"}, el("span",{},"Couvrir"), sel));
  root.append(el("p",{class:"intro"},"Ce qu'il faut pour le planning de la semaine, moins ce que tu as déjà dans Stock."));
  const rows = buyList();
  if (!rows.length) { root.append(el("p",{class:"empty"},"Ton stock couvre déjà cette durée.")); return; }
  let total = 0;
  for (const c of CATS) {
    const rs = rows.filter(r=>items()[r.k].cat===c.id); if (!rs.length) continue;
    root.append(el("h2",{},c.name));
    for (const r of rs) {
      const it = items()[r.k]; total += r.cost;
      const warn = it.fresh && r.left>0 && it.unit!=="pc"
        ? "Il en restera ~"+fmtQty(r.k, r.left)+" : sans congélateur, à finir dans les "+it.fresh+" jours."
        : (it.fresh && cover>7 ? "Se garde "+it.fresh+" jours : achète-le en deux fois." : null);
      root.append(el("div",{class:"buy"},
        el("div",{class:"buy-name"}, it.name),
        el("div",{class:"buy-price"}, eur(r.cost)),
        el("div",{class:"buy-detail"}, r.packs+" × "+it.packLabel+(state.stock[r.k] ? ", en stock : "+fmtQty(r.k, state.stock[r.k]) : "")),
        warn ? el("div",{class:"buy-warn"}, warn) : null));
    }
  }
  root.append(el("div",{class:"total"}, el("span",{},"Total en caisse"), el("b",{}, eur(total))));
  root.append(el("button",{class:"primary", style:"margin-top:14px", onclick:()=>{
    for (const r of buyList()) state.stock[r.k] = (state.stock[r.k]||0) + r.packs*(items()[r.k].pack||0);
    save(); render(); toast("Courses ajoutées au stock");
  }},"J'ai fait ces courses"));
  root.append(el("p",{class:"note"},"Le total en caisse compte les paquets entiers, il dépasse donc le coût de la semaine : le reste servira les semaines suivantes. Prix à ajuster dans l'onglet Aliments."));
}

/* ============================================================
   11. Onglet Stock
   ============================================================ */
function renderStock(){
  const root = document.getElementById("tab-stock"); root.replaceChildren();
  if (Object.values(state.stock).every(v=>!v)) root.append(el("div",{class:"banner"},
    el("p",{},"Indique ce que tu as déjà (riz, pâtes, huile, épices…) : la liste de courses en tient compte. Appuie sur « Cuisiné » dans une recette pour retirer ses ingrédients.")));
  for (const c of CATS) {
    const list = Object.entries(items()).filter(([,it])=>it.cat===c.id);
    if (!list.length) continue;
    root.append(el("h2",{},c.name));
    for (const [k,it] of list) {
      const dl = daysLeft(k);
      root.append(el("div",{class:"item"},
        el("div",{},
          el("div",{class:"item-name"}, it.name),
          el("div",{class:"item-days"+(dl<3?" low":"")}, dl===Infinity ? "Pas dans le planning" : dl<1 ? "Moins d'un jour" : "~"+nf(Math.floor(dl))+" jours")),
        el("div",{class:"qty"}, numInput(state.stock[k]||0, v=>{ state.stock[k] = v>0 ? v : 0; save(); render(); }), el("small",{}, unitLabel(it.unit))),
        el("button",{class:"pack", onclick:()=>{ state.stock[k] = (state.stock[k]||0) + (it.pack||0); save(); render(); }, title:"Ajouter "+it.packLabel},
          "+ "+((it.unit==="g"||it.unit==="ml") ? fmtQty(k, it.pack) : nf(it.pack)))));
    }
  }
}

/* ============================================================
   12. Onglet Aliments (prix et valeurs)
   ============================================================ */
let foodQuery = "";
const norm = s => s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
function createItem(name){
  const id = newId(name || "aliment", x=>items()[x]);
  const nut = {}; NUT_KEYS.forEach(n=>nut[n]=0);
  state.items[id] = {name:name || "Nouvel aliment", unit:"g", cat:"epicerie", pack:500, packLabel:"500 g", price:0, fam:"", nut};
  state.stock[id] = 0;
  openKeys.add("food-"+id);
  return id;
}
function deleteItem(k){
  const it = items()[k];
  const used = dishes().filter(d=>d.ing[k]!==undefined);
  const msg = used.length
    ? "« "+it.name+" » est dans "+used.length+(used.length>1?" recettes":" recette")+" ("+used.map(d=>d.name).slice(0,4).join(", ")+(used.length>4?"…":"")+"). Le retirer de ces recettes et le supprimer ?"
    : "Supprimer « "+it.name+" » ?";
  if (!confirm(msg)) return;
  for (const d of used) delete d.ing[k];
  delete state.items[k]; delete state.stock[k];
  save(); render(); toast("Aliment supprimé");
}

function renderAliments(){
  const root = document.getElementById("tab-aliments"); root.replaceChildren();
  root.append(el("p",{class:"intro"},"Mets ici les prix de ton magasin : le prix de chaque plat, le planning et le budget se recalculent. Les valeurs nutritionnelles se corrigent avec celles des étiquettes."));
  const search = el("input",{type:"search", placeholder:"Chercher un aliment", "aria-label":"Chercher un aliment", value:foodQuery});
  const list = el("div",{});
  search.addEventListener("input", e=>{ foodQuery = e.target.value; drawFoods(list); });
  root.append(el("div",{class:"controls"}, search,
    el("button",{class:"primary", onclick:()=>{
      const name = (prompt("Nom du nouvel aliment ?")||"").trim(); if (!name) return;
      const id = createItem(name); foodQuery = ""; save(); render();
      document.querySelector('[data-key="food-'+id+'"]')?.scrollIntoView({block:"start"});
      toast("Complète son prix, son format et ses valeurs");
    }},"+ Nouvel aliment")));
  root.append(list);
  drawFoods(list);
}
function drawFoods(list){
  list.replaceChildren();
  const q = norm(foodQuery.trim());
  let any = false;
  for (const c of CATS) {
    const rows = Object.entries(items()).filter(([,it])=>it.cat===c.id && (!q || norm(it.name).includes(q)))
      .sort((a,b)=>a[1].name.localeCompare(b[1].name,"fr"));
    if (!rows.length) continue;
    any = true;
    list.append(el("h2",{},c.name));
    for (const [k,it] of rows) list.append(foodBlock(k,it));
  }
  if (!any) list.append(el("p",{class:"empty"},"Aucun aliment ne correspond. Crée-le avec « + Nouvel aliment »."));
}

function pricePer(it){
  if (!it.pack) return "";
  if (it.unit==="g") return eur(it.price/it.pack*1000)+" le kg";
  if (it.unit==="ml") return eur(it.price/it.pack*1000)+" le litre";
  return eur(it.price/it.pack)+" la pièce";
}
function famInput(it){
  const s = el("select",{}, el("option",{value:"", selected:!it.fam},"Aucune"),
    ...[["feculent","Féculents"],["proteine","Protéines"]].map(([kind,lab])=>
      el("optgroup",{label:lab}, ...FAMS[kind].map(f=>el("option",{value:f, selected:it.fam===f}, f)))));
  s.addEventListener("change", e=>{ it.fam = e.target.value; save(); render(); });
  return s;
}
function foodBlock(k, it){
  const per = (it.unit==="g"||it.unit==="ml") ? "pour 100 "+it.unit : "par pièce";
  const used = dishes().filter(d=>d.ing[k]!==undefined);
  const det = el("details",{class:"food", "data-key":"food-"+k},
    el("summary",{}, it.name, el("span",{}, eur(it.price)+" · "+it.packLabel)));
  const box = el("div",{class:"fields"});

  box.append(field("Nom", textInput(it.name, v=>{ if (v) it.name = v; save(); render(); })));
  box.append(field("Prix du format (€)", numInput(it.price, v=>{ it.price = v; save(); render(); })));
  box.append(field("Format ("+unitLabel(it.unit)+")", numInput(it.pack, v=>{ it.pack = v; save(); render(); })));
  box.append(field("Nom du format", textInput(it.packLabel, v=>{ it.packLabel = v; save(); render(); })));
  box.append(el("div",{class:"wide hint"}, pricePer(it)));

  box.append(field("Unité", selectInput([["g","g"],["ml","ml"],["pc","pièce"]], it.unit, v=>{ it.unit = v; save(); render(); })));
  box.append(field("Rayon", selectInput(CATS.map(c=>[c.id,c.name]), it.cat, v=>{ it.cat = v; save(); render(); })));
  box.append(field("Famille (filtres)", famInput(it)));
  box.append(field("Gluten", selectInput([["0","Sans"],["1","Contient du gluten"]], it.gluten?1:0, v=>{ it.gluten = v==="1"; save(); render(); })));
  box.append(field("Se garde au frigo (jours, 0 = longtemps)", numInput(it.fresh||0, v=>{ it.fresh = v>0 ? v : 0; save(); render(); }, {step:"1"})));

  box.append(el("div",{class:"sep"},"Valeurs "+per));
  for (const n of NUT_KEYS) {
    const [label,unitN] = NUT_INFO[n];
    box.append(field(label+" ("+unitN+")", numInput(it.nut[n], v=>{ it.nut[n]=v; save(); render(); })));
  }

  box.append(el("div",{class:"wide hint"}, used.length
    ? "Dans "+used.length+(used.length>1?" recettes : ":" recette : ")+used.map(d=>d.name).join(", ")
    : "Dans aucune recette pour l'instant."));
  box.append(el("div",{class:"row-btns wide"}, el("button",{class:"danger", onclick:()=>deleteItem(k)},"Supprimer cet aliment")));

  det.append(box);
  return det;
}

/* ============================================================
   13. Onglet Profil
   ============================================================ */
function renderProfil(){
  const root = document.getElementById("tab-profil"); root.replaceChildren();
  const p = state.profile;
  const set = (key, after) => v => { p[key] = v; if (after) after(); save(); render(); };

  root.append(el("h2",{},"Toi"));
  const box = el("div",{class:"fields"});
  box.append(field("Sexe", selectInput([["f","Femme"],["m","Homme"]], p.male?"m":"f", v=>{ p.male = v==="m"; save(); render(); })));
  box.append(field("Âge", numInput(p.age, set("age"), {step:"1"})));
  box.append(field("Taille (cm)", numInput(p.cm, set("cm"), {step:"1"})));
  box.append(field("Poids (kg)", numInput(p.kg, set("kg", ()=>{ state.kgSet = true; }), {step:"0.1"})));
  box.append(field("Pas par jour, en moyenne", numInput(p.steps, set("steps"), {step:"500"})));
  box.append(field("Séances de sport par semaine", numInput(p.sessions, set("sessions"), {step:"0.5"})));
  box.append(field("Durée d'une séance (min)", numInput(p.sessionMin, set("sessionMin"), {step:"5"})));
  box.append(field("Intensité des séances", selectInput([[0,"Légère"],[1,"Modérée"],[2,"Intense"]], p.intensity, v=>{ p.intensity = Number(v); save(); render(); })));
  root.append(box);
  if (!state.kgSet) root.append(el("p",{class:"hint"},"Le poids est une valeur par défaut : remplace-le par le tien."));

  const m = maintenance(), kg = Number(p.kg)||60;
  root.append(el("div",{class:"card"},
    el("div",{class:"card-top"}, el("span",{class:"card-label"},"Besoins estimés"),
      el("span",{class:"card-val"}, nf(Math.round(m.total/50)*50), el("small",{}," kcal / jour"))),
    el("div",{class:"lines"},
      el("div",{class:"line"}, el("span",{},"Métabolisme de base"), el("b",{}, nf(m.bmr)+" kcal")),
      el("div",{class:"line"}, el("span",{},"Vie quotidienne"), el("b",{}, nf(m.daily)+" kcal")),
      el("div",{class:"line"}, el("span",{},"Marche"), el("b",{}, nf(m.steps)+" kcal")),
      el("div",{class:"line"}, el("span",{},"Salle (moyenne par jour)"), el("b",{}, nf(m.training)+" kcal"))),
    el("p",{class:"card-status"},"Protéines : ~"+nf(Math.round(kg*1.2/5)*5)+" à "+nf(Math.round(kg*1.6/5)*5)+" g par jour suffisent, soit 20 à 30 g par repas."),
    el("p",{class:"micro-note"},"Estimation Mifflin-St Jeor, à ±10 %. Le but n'est pas de compter : ça sert juste à situer les plats et les portions.")));

  root.append(el("h2",{},"Budget et repas"));
  const box2 = el("div",{class:"fields"});
  box2.append(field("Budget nourriture max par mois (€)", numInput(state.budget, v=>{ state.budget = v>0 ? v : 200; save(); render(); }, {step:"10"})));
  box2.append(field("Pâtes", selectInput([["normal","Classiques"],["sg","Sans gluten (maïs-riz)"]], state.pasta, v=>{ state.pasta = v; save(); render(); })));
  box2.append(field("Repas avec gluten max par semaine", numInput(state.maxGluten, v=>{ state.maxGluten = Math.round(v); save(); render(); }, {step:"1"})));
  root.append(box2);
  root.append(el("p",{class:"hint"},"Pâtes, pain et wraps contiennent du gluten. La limite sert quand une semaine est proposée ; les pâtes sans gluten (~"
    +eur(items().pates_sg ? items().pates_sg.price/items().pates_sg.pack*1000 : 0)+" le kg) ne comptent pas."));

  root.append(el("h2",{},"Sauvegarde"));
  root.append(el("p",{class:"intro"},"Tout est stocké sur cet appareil. Exporte de temps en temps pour ne rien perdre, ou pour passer sur un autre téléphone."));
  const area = el("textarea",{class:"mono", readonly:true, hidden:true});
  root.append(el("div",{class:"row-btns"},
    el("button",{class:"primary", onclick:async ()=>{
      const json = JSON.stringify(state, null, 1);
      area.value = json; area.hidden = false;
      try { await navigator.clipboard.writeText(json); toast("Copié dans le presse-papier"); }
      catch(e){ area.select(); toast("Sélectionne le texte et copie-le"); }
    }},"Exporter"),
    el("button",{class:"ghost", onclick:()=>{
      const blob = new Blob([JSON.stringify(state, null, 1)], {type:"application/json"});
      const url = URL.createObjectURL(blob);
      const a = el("a",{href:url, download:"suical-"+new Date().toISOString().slice(0,10)+".json"});
      document.body.append(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url), 5000);
      toast("Fichier téléchargé");
    }},"Télécharger"),
    el("button",{class:"ghost", onclick:()=>{ area.hidden=false; area.readOnly=false; area.value=""; area.placeholder="Colle ici un export, puis appuie sur Importer"; area.focus(); }},"Coller un export"),
    el("button",{class:"ghost", onclick:()=>{
      if (!area.value.trim()) { toast("Colle d'abord un export"); return; }
      try { const d = JSON.parse(area.value);
        if (d.v!==3) { toast("Export d'une ancienne version, pas compatible"); return; }
        if (!confirm("Remplacer toutes tes données par cet export ?")) return;
        state = migrate(d); resizePlan(); saveNow(); render(); toast("Import terminé"); }
      catch(e){ toast("Export illisible"); }
    }},"Importer"),
    el("button",{class:"danger", onclick:()=>{
      if (!confirm("Tout réinitialiser ? Recettes, prix, stock et profil repartent des valeurs de départ.")) return;
      state = freshState(); state.plan = autoPlan(); saveNow(); render(); toast("Réinitialisé");
    }},"Réinitialiser")));
  root.append(area);
}

/* ============================================================
   14. Démarrage
   ============================================================ */
/* Position d'un nœud dans son onglet, pour retrouver son équivalent une fois l'onglet redessiné. */
function pathOf(node){
  const p = [];
  while (node && node.parentElement && !(node.id||"").startsWith("tab-")) { p.unshift([...node.parentElement.children].indexOf(node)); node = node.parentElement; }
  return node && (node.id||"").startsWith("tab-") ? {root:node.id, p} : null;
}
function nodeAt(loc){
  let n = document.getElementById(loc.root);
  for (const i of loc.p) { if (!n) return null; n = n.children[i]; }
  return n;
}
const openKeys = new Set();
function render(){
  if (soft && typing()) { pendingRender = true; return; }
  pendingRender = false;
  const open = new Set([...openKeys, ...[...document.querySelectorAll("details[data-key][open]")].map(x=>x.dataset.key)]);
  openKeys.clear();
  const act = document.activeElement;
  const focus = act && /^(INPUT|SELECT|TEXTAREA)$/.test(act.tagName) ? pathOf(act) : null;
  draw();
  document.querySelectorAll("details[data-key]").forEach(x=>{ if (open.has(x.dataset.key)) x.open = true; });
  if (focus) { const n = nodeAt(focus);
    if (n && n.tagName===act.tagName && n.type===act.type) n.focus({preventScroll:true}); }
}
function draw(){
  recomputeDaily();
  const m = monthOf(weekCost());
  document.getElementById("sub").textContent = "~"+nf(Math.round(maintenance().total/50)*50)+" kcal par jour · planning à ~"+eur0(m)+" par mois sur "+eur0(state.budget);
  renderRecettes(); renderSemaine(); renderCourses(); renderStock(); renderAliments(); renderProfil();
}
document.querySelectorAll("nav button").forEach(b=>b.addEventListener("click",()=>showTab(b.dataset.tab)));
(async () => {
  await load();
  resizePlan();
  if (!state.plan.some(day=>day.some(Boolean))) { state.plan = autoPlan(); save(); }
  render();
  if ("serviceWorker" in navigator) {
    try { await navigator.serviceWorker.register("./sw.js"); } catch(e){ /* hors ligne indisponible */ }
  }
})();
